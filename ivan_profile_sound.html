<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иван Диогенов - профиль</title>
    <style>
        body {
            background: radial-gradient(circle at 20% 30%, #1a0a0a, #0a0000);
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        .crt {
            max-width: 1000px;
            margin: 0 auto;
            background: #0a0a0a;
            border: 8px solid #3a2a2a;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .monokuma-header {
            text-align: center;
            border-bottom: 3px solid #d44a2e;
            margin-bottom: 20px;
        }
        .monokuma-header h1 {
            font-size: 32px;
            color: #ffaa88;
            text-shadow: 2px 2px 0 #5a1a1a;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: #2a1a1a;
            border: none;
            color: #ccaa88;
            padding: 10px 16px;
            font-family: monospace;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #4a2a2a;
            color: #ffaa66;
            box-shadow: 0 0 8px #ff8866;
        }
        .tab-content {
            display: none;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 8px;
        }
        .tab-content.active { display: block; }
        .id-card {
            background: #111;
            border: 2px solid #aa5544;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .id-avatar {
            width: 80px;
            height: 80px;
            border: 3px solid #ff8866;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .bracelet {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-left: 8px;
            vertical-align: middle;
        }
        .bracelet.green { background: #00ff00; box-shadow: 0 0 5px #00ff00; animation: pulse 1s infinite; }
        .bracelet.red { background: #ff0000; box-shadow: 0 0 5px #ff0000; animation: pulse 0.3s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }
        .quote, .sprite-pose, .evidence-card, .execution {
            background: #181010;
            border-left: 6px solid #ff6644;
            padding: 14px;
            margin: 15px 0;
            border-radius: 16px;
        }
        button {
            background: #2a1a1a;
            border: 2px solid #aa6644;
            color: #ffccaa;
            padding: 12px;
            width: 100%;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #4a2a2a;
            box-shadow: 0 0 12px #ff8866;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a0a0a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #aa5544; border-radius: 10px; }
    </style>
</head>
<body>
<div class="crt">
    <div class="monokuma-header">
        <h1>⚡ ФАЙЛ MONOKUMA: ИВАН ДИОГЕНОВ ⚡</h1>
    </div>
    <!-- Вкладки и контент такие же, как в предыдущей версии, просто стили обновлены -->
    <!-- Для полноты можно оставить содержимое из предыдущего ответа -->
</div>
<script>/* скрипт вкладок */</script>
</body>
</html>
