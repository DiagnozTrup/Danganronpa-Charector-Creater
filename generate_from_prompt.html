<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Генерация персонажа через промпт | Danganronpa</title>
    <style>
        /* === ОБЩИЕ СТИЛИ (улучшенная читаемость, эффекты) === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', 'Courier', monospace;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Эффект "кинескопа" */
        .crt {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            background: #0a0a0a;
            border: 8px solid #3a2a2a;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            backdrop-filter: blur(1px);
        }
        .crt::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            border-radius: 26px;
        }
        /* Заголовки */
        h1 {
            text-align: center;
            font-size: clamp(28px, 7vw, 42px);
            color: #ff8866;
            text-shadow: 0 0 6px #ff4422, 2px 2px 0 #3a1a1a;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
        .sub {
            text-align: center;
            color: #dd8888;
            font-size: 18px;
            margin-bottom: 30px;
            border-bottom: 2px solid #aa5544;
            padding-bottom: 15px;
            font-weight: bold;
        }
        /* Блок ввода промпта */
        .prompt-area {
            background: #111111cc;
            border-left: 6px solid #d45a2e;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
            transition: border 0.2s;
        }
        .prompt-area label {
            display: block;
            font-weight: bold;
            color: #ffccaa;
            margin-bottom: 12px;
            font-size: 18px;
        }
        textarea {
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #aa5544;
            color: #f0e0d0;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            border-radius: 20px;
            resize: vertical;
            transition: all 0.2s;
            line-height: 1.5;
        }
        textarea:focus {
            border-color: #ff8866;
            outline: none;
            box-shadow: 0 0 12px #ff6644;
        }
        /* Кнопки */
        button {
            background: #2a1a1a;
            border: 2px solid #aa6644;
            color: #ffccaa;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 60px;
            transition: all 0.2s ease;
            margin-top: 12px;
            letter-spacing: 1px;
        }
        button:hover {
            background: #4a2a2a;
            border-color: #ffaa66;
            color: #fff;
            box-shadow: 0 0 16px #ff8866;
            transform: scale(1.01);
        }
        .example-btn {
            background: #1a3a2a;
            border-color: #66aa66;
        }
        .example-btn:hover {
            background: #2a5a2a;
            box-shadow: 0 0 12px #88ff88;
        }
        /* Результат */
        .result-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #aa5544;
            display: none;
        }
        .result-header {
            color: #88ff88;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            text-shadow: 0 0 6px #00aa00;
            font-weight: bold;
        }
        .preview-card {
            background: #1a1f1aee;
            border: 2px solid #ffaa66;
            border-radius: 28px;
            width: 260px;
            padding: 20px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            transition: transform 0.2s;
        }
        .preview-card:hover {
            transform: scale(1.02);
            border-color: #ffcc88;
        }
        .preview-avatar {
            font-size: 72px;
            margin-bottom: 10px;
        }
        .preview-name {
            font-size: 22px;
            font-weight: bold;
            color: #ffeebb;
            text-shadow: 1px 1px 0 #2a1a1a;
        }
        .preview-talent {
            font-size: 14px;
            color: #ddbb88;
            margin-top: 6px;
            font-weight: bold;
        }
        .preview-tag {
            background: #000000aa;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 40px;
            color: #ffcc88;
            margin-top: 12px;
            font-size: 12px;
        }
        .extracted-info {
            background: #1a1a1a;
            padding: 18px;
            border-radius: 24px;
            margin-top: 20px;
            font-size: 15px;
            border-left: 4px solid #ffaa66;
            line-height: 1.5;
        }
        /* Уведомления */
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #2a4a2a;
            color: #cfeca8;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 15px;
            z-index: 1000;
            animation: fadeOut 3s forwards;
            box-shadow: 0 0 12px #88ff88;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; transform: translateY(20px); }
        }
        /* Навигация */
        .main-link {
            display: inline-block;
            background: #1a2a1a;
            color: #ccffaa;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 16px;
            margin-bottom: 25px;
            transition: 0.2s;
            font-weight: bold;
            border: 1px solid #66aa66;
        }
        .main-link:hover {
            background: #2a4a2a;
            box-shadow: 0 0 12px #88ff88;
            color: white;
        }
        .success-buttons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            justify-content: center;
        }
        .success-buttons button {
            margin-top: 0;
            width: auto;
            padding: 12px 24px;
        }
        .note {
            margin-top: 25px;
            color: #aa8866;
            text-align: center;
            font-size: 14px;
            border-top: 1px solid #5a3a2a;
            padding-top: 18px;
        }
        /* Адаптив */
        @media (max-width: 700px) {
            .crt { padding: 20px; }
            button { font-size: 16px; }
            .preview-card { width: 220px; }
        }
    </style>
</head>
<body>
<div class="crt">
    <a href="index.html" class="main-link">🏠 НА ГЛАВНУЮ</a>
    <h1>⚡ ГЕНЕРАЦИЯ ПЕРСОНАЖА ИЗ ПРОМПТА ⚡</h1>
    <div class="sub">Вставь описание — и персонаж автоматически добавится в главное меню!</div>

    <div class="prompt-area">
        <label>📝 ВВЕДИТЕ ПРОМПТ (свободная форма):</label>
        <textarea id="promptInput" rows="8" placeholder="Например:
Имя: Иван Диогенов
Талант: Бета-тестер Реальности
Фирменная фраза: «Интересный ход… но у меня есть пасхалки»
Внешность: школьная форма, картридж вместо галстука
Характер: говорит короткими фразами, использует слова «баг», «промпт»
Тайна: читает исходный код игры
Название казни: «Жестокая отладка»
Описание казни: Monokuma запускает Windows 95, команда kill -9 не срабатывает
Фраза перед казнью: «Я сохранил лог»
Улика: обрывок системного лога Monokuma"></textarea>
        <button id="exampleBtn" class="example-btn">📋 ЗАПОЛНИТЬ ПРИМЕРОМ</button>
        <button id="generateBtn">🔮 СОЗДАТЬ И СОХРАНИТЬ В МЕНЮ 🔮</button>
    </div>

    <div id="resultArea" class="result-area">
        <div class="result-header">✅ ПЕРСОНАЖ ГОТОВ И ДОБАВЛЕН В МЕНЮ!</div>
        <div id="characterPreview"></div>
        <div class="success-buttons">
            <button id="goToMenuBtn">🏠 ПЕРЕЙТИ В ГЛАВНОЕ МЕНЮ</button>
            <button id="generateAnotherBtn">🔄 СОЗДАТЬ ЕЩЁ</button>
        </div>
    </div>
    <div class="note">✨ Промпт может быть в произвольной форме. ИИ извлечёт имя, талант, фразу и другие ключевые поля.</div>
</div>

<script>
    // Уведомления
    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // Парсер промпта (извлекает поля)
    function parsePrompt(text) {
        let name = (text.match(/имя[:\s]+([^\n]+)/i) || [])[1] || 'Сгенерированный персонаж';
        let talent = (text.match(/талант[:\s]+([^\n]+)/i) || [])[1] || 'Новый талант';
        let phrase = (text.match(/фраз[аы][:\s]+«?([^»\n]+)»?/i) || [])[1] || '«...»';
        let appearance = (text.match(/внешность[:\s]+([^\n]+)/i) || [])[1] || 'Стандартная форма';
        let personality = (text.match(/характер[:\s]+([^\n]+)/i) || [])[1] || 'Загадочный';
        let secret = (text.match(/тайна[:\s]+([^\n]+)/i) || [])[1] || 'Неизвестно';
        let execName = (text.match(/казнь[:\s]+«?([^»\n]+)»?/i) || [])[1] || 'Казнь';
        let execDesc = (text.match(/описание казни[:\s]+([^\n]+)/i) || [])[1] || 'Описание казни';
        let lastWords = (text.match(/фраза перед казнью[:\s]+«?([^»\n]+)»?/i) || [])[1] || '«...»';
        let evidence = (text.match(/улик[аы][:\s]+([^\n]+)/i) || [])[1] || 'Нет улики';
        return {
            name: name.trim(),
            talent: talent.trim(),
            phrase: phrase.trim(),
            appearance: appearance.trim(),
            personality: personality.trim(),
            secret: secret.trim(),
            execName: execName.trim(),
            execDesc: execDesc.trim(),
            lastWords: lastWords.trim(),
            evidence: evidence.trim()
        };
    }

    // Аватар по первой букве
    function getAvatar(name) {
        let first = name.charAt(0).toUpperCase();
        let avatars = { 'И':'⚡', 'К':'🔧', 'Т':'🎮', 'С':'🎵', 'М':'🎭', 'А':'⭐', 'В':'⚡', 'Д':'🎲', 'Е':'📖' };
        return avatars[first] || '⭐';
    }

    // Сохранение персонажа в localStorage (только основные поля)
    function saveCharacter(character) {
        try {
            let chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
            chars = chars.filter(c => c.name !== character.name);
            chars.push({
                name: character.name,
                talent: character.talent,
                phrase: character.phrase,
                avatar: character.avatar
            });
            localStorage.setItem('customCharacters', JSON.stringify(chars));
            return true;
        } catch(e) {
            console.error('Ошибка сохранения', e);
            alert('Ошибка: превышен лимит localStorage или другие проблемы');
            return false;
        }
    }

    // Основная генерация и сохранение
    function generateAndSave() {
        let text = document.getElementById('promptInput').value.trim();
        if (!text) {
            alert('Введите промпт!');
            return;
        }
        let data = parsePrompt(text);
        let character = {
            name: data.name,
            talent: data.talent,
            phrase: data.phrase,
            avatar: getAvatar(data.name)
        };
        // Дополнительные поля для предпросмотра (не сохраняем)
        let fullData = { ...character, ...data };

        if (saveCharacter(character)) {
            // Показываем предпросмотр карточки
            let previewDiv = document.getElementById('characterPreview');
            previewDiv.innerHTML = `
                <div class="preview-card">
                    <div class="preview-avatar">${character.avatar}</div>
                    <div class="preview-name">${character.name.toUpperCase()}</div>
                    <div class="preview-talent">${character.talent}</div>
                    <div class="preview-tag">${character.phrase.substring(0, 40)}</div>
                </div>
                <div class="extracted-info">
                    <strong>📋 Персонаж сохранён в меню!</strong><br>
                    📛 Имя: ${character.name}<br>
                    🎭 Талант: ${character.talent}<br>
                    💬 Фраза: ${character.phrase}<br>
                    👁️ Внешность: ${data.appearance}<br>
                    ⚡ Характер: ${data.personality}<br>
                    🔮 Тайна: ${data.secret}<br>
                    💀 Казнь: ${data.execName}<br>
                    🔪 Улика: ${data.evidence}<br>
                    💾 Теперь персонаж доступен на главной странице.
                </div>
            `;
            document.getElementById('resultArea').style.display = 'block';
            showToast(`✅ Персонаж "${character.name}" добавлен в меню!`);
        } else {
            showToast('⚠️ Ошибка сохранения');
        }
    }

    // Пример для заполнения
    document.getElementById('exampleBtn').onclick = () => {
        document.getElementById('promptInput').value = `Имя: Иван Диогенов
Талант: Бета-тестер Реальности
Фирменная фраза: «Интересный ход… но у меня есть пасхалки»
Внешность: школьная форма, картридж вместо галстука, чёрно-красная гамма
Характер: говорит короткими фразами, использует слова «баг», «промпт», «код»
Тайна: читает исходный код игры, Monokuma боится его
Название казни: «Жестокая отладка»
Описание казни: Monokuma запускает Windows 95, команда kill -9 не срабатывает
Фраза перед казнью: «Я сохранил лог. В следующем прохождении я выиграю»
Улика: обрывок системного лога Monokuma о промпт-ограничениях`;
        showToast('📋 Пример загружен!');
    };

    document.getElementById('generateBtn').onclick = generateAndSave;
    document.getElementById('goToMenuBtn').onclick = () => window.location.href = 'index.html';
    document.getElementById('generateAnotherBtn').onclick = () => {
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('promptInput').value = '';
        document.getElementById('promptInput').focus();
    };
</script>
</body>
</html>
