<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Генерация персонажа через промпт</title>
    <style>
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .crt {
            max-width: 1000px;
            margin: auto;
            background: #0a0a0a;
            border: 8px solid #3a2a2a;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: clamp(28px, 7vw, 38px);
            color: #ff8866;
            text-shadow: 0 0 6px #ff4422, 2px 2px 0 #3a1a1a;
            margin-bottom: 15px;
        }
        .sub {
            text-align: center;
            color: #dd8888;
            font-size: 16px;
            margin-bottom: 30px;
            border-bottom: 2px solid #aa5544;
            padding-bottom: 15px;
        }
        .prompt-area {
            background: #111111cc;
            border-left: 6px solid #d45a2e;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
        }
        textarea {
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #aa5544;
            color: #f0e0d0;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 16px;
            resize: vertical;
            transition: border 0.2s;
        }
        textarea:focus {
            border-color: #ff8866;
            outline: none;
            box-shadow: 0 0 10px #ff6644;
        }
        button {
            background: #2a1a1a;
            border: 2px solid #aa6644;
            color: #ffccaa;
            padding: 14px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 40px;
            transition: all 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #4a2a2a;
            border-color: #ffaa66;
            color: #fff;
            box-shadow: 0 0 15px #ff8866;
            transform: scale(1.01);
        }
        .example-btn {
            background: #1a3a2a;
            border-color: #66aa66;
        }
        .result-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #aa5544;
            display: none;
        }
        .result-header {
            color: #88ff88;
            text-align: center;
            margin-bottom: 15px;
            font-size: 20px;
            text-shadow: 0 0 4px #00aa00;
        }
        .preview-card {
            background: #1a1f1aee;
            border: 2px solid #ffaa66;
            border-radius: 28px;
            width: 240px;
            padding: 20px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .preview-avatar {
            font-size: 64px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a4a2a;
            color: #cfeca8;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 3s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; transform: translateY(20px); }
        }
        .main-link {
            display: inline-block;
            background: #1a2a1a;
            color: #ccffaa;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .main-link:hover {
            background: #2a4a2a;
            box-shadow: 0 0 8px #88ff88;
        }
        .success-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .success-buttons button {
            margin-top: 0;
        }
    </style>
</head>
<body>
<div class="crt">
    <a href="index.html" class="main-link">🏠 НА ГЛАВНУЮ</a>
    <h1>⚡ ГЕНЕРАЦИЯ ПЕРСОНАЖА ИЗ ПРОМПТА ⚡</h1>
    <div class="sub">Вставь промпт — и персонаж автоматически добавится в главное меню!</div>
    <div class="prompt-area">
        <textarea id="promptInput" placeholder="Например:
Имя: Иван Диогенов
Талант: Бета-тестер Реальности
Фирменная фраза: «Интересный ход… но у меня есть пасхалки»..."></textarea>
        <button id="exampleBtn" class="example-btn">📋 ЗАПОЛНИТЬ ПРИМЕРОМ</button>
        <button id="generateBtn">🔮 СГЕНЕРИРОВАТЬ И СОХРАНИТЬ В МЕНЮ 🔮</button>
    </div>
    <div id="resultArea" class="result-area">
        <div class="result-header">✅ ПЕРСОНАЖ СОЗДАН И ДОБАВЛЕН В МЕНЮ!</div>
        <div id="characterPreview"></div>
        <div class="success-buttons">
            <button id="goToMenuBtn">🏠 ПЕРЕЙТИ В ГЛАВНОЕ МЕНЮ</button>
            <button id="generateAnotherBtn">🔄 СОЗДАТЬ ЕЩЁ</button>
        </div>
    </div>
    <div class="note" style="margin-top: 20px; color: #aa8866; text-align: center;">✨ Промпт может быть в свободной форме.</div>
</div>

<script>
    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
    function parsePrompt(text) {
        let name = (text.match(/имя[:\s]+([^\n]+)/i) || [])[1] || 'Сгенерированный персонаж';
        let talent = (text.match(/талант[:\s]+([^\n]+)/i) || [])[1] || 'Новый талант';
        let phrase = (text.match(/фраз[аы][:\s]+«?([^»\n]+)»?/i) || [])[1] || '«...»';
        let appearance = (text.match(/внешность[:\s]+([^\n]+)/i) || [])[1] || 'Стандартная форма';
        let personality = (text.match(/характер[:\s]+([^\n]+)/i) || [])[1] || 'Загадочный';
        let secret = (text.match(/тайна[:\s]+([^\n]+)/i) || [])[1] || 'Неизвестно';
        let execName = (text.match(/казнь[:\s]+«?([^»\n]+)»?/i) || [])[1] || 'Казнь';
        let execDesc = (text.match(/описание казни[:\s]+([^\n]+)/i) || [])[1] || 'Описание казни';
        let lastWords = (text.match(/фраза перед казнью[:\s]+«?([^»\n]+)»?/i) || [])[1] || '«...»';
        let evidence = (text.match(/улик[аы][:\s]+([^\n]+)/i) || [])[1] || 'Нет улики';
        return { name: name.trim(), talent: talent.trim(), phrase: phrase.trim(), appearance: appearance.trim(), personality: personality.trim(), secret: secret.trim(), execName: execName.trim(), execDesc: execDesc.trim(), lastWords: lastWords.trim(), evidence: evidence.trim() };
    }
    function generateCharacterHTML(data) {
        let { name, talent, phrase, appearance, personality, secret, execName, execDesc, lastWords, evidence } = data;
        return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>${name}</title><style>body{background:#1a0000;font-family:'Courier New';padding:20px;}.crt{max-width:1000px;margin:auto;background:#0a0a0a;border:8px solid #3a1a1a;padding:20px;}.tabs{display:flex;gap:5px;flex-wrap:wrap;}.tab-btn{background:#2a0a0a;border:none;color:#aa7777;padding:10px;cursor:pointer;}.tab-btn.active{background:#4a1a1a;color:#ff5555;}.tab-content{display:none;}.tab-content.active{display:block;}.id-card{background:#111;border:2px solid #333;padding:15px;display:flex;gap:15px;}.id-avatar{width:70px;height:70px;border:2px solid #d42e2e;display:flex;align-items:center;justify-content:center;font-size:30px;}.quote{border-left:4px solid #ff4444;background:#181010;padding:10px;margin:10px 0;}.execution{background:#1a0000;border:2px solid #aa2222;padding:10px;}button{background:#2a0a0a;border:1px solid #aa4444;color:#ffaaaa;padding:10px;width:100%;margin-top:15px;}</style></head>
<body><div class="crt">
<div class="tabs"><button class="tab-btn active" data-tab="tab1">📁 Личное дело</button><button class="tab-btn" data-tab="tab2">🎭 Диалоги</button><button class="tab-btn" data-tab="tab3">💀 Казнь</button><button class="tab-btn" data-tab="tab4">🔍 Улики</button><button class="tab-btn" data-tab="tab5">🖼️ Галерея</button><button class="tab-btn" data-tab="tab6">🎵 Саундтрек</button><button class="tab-btn" data-tab="tab7">📜 Секретный файл</button></div>
<div id="tab1" class="tab-content active"><div class="id-card"><div class="id-avatar">⭐</div><div><p><strong>Имя:</strong> ${name}</p><p><strong>Талант:</strong> ${talent}</p><p><strong>Фраза:</strong> ${phrase}</p></div></div><div class="quote">${phrase}</div><div class="quote"><strong>Внешность:</strong> ${appearance}</div><div class="quote"><strong>Характер:</strong> ${personality}</div><div class="execution">⚡ СЕКРЕТ: ${secret}</div></div>
<div id="tab2" class="tab-content"><div class="quote">MONOKUMA: Пупупу! Ты кто?<br>${name}: ${phrase}</div></div>
<div id="tab3" class="tab-content"><div class="execution"><strong>${execName}</strong><br>${execDesc}</div><div class="quote">${lastWords}</div></div>
<div id="tab4" class="tab-content"><div class="quote"><strong>Улика:</strong> ${evidence}</div></div>
<div id="tab5" class="tab-content"><div class="quote">Нейтральный спрайт: спокойная поза.<br>Эмоциональный спрайт: наклон вперёд.</div></div>
<div id="tab6" class="tab-content"><div class="quote">Основная тема: загадочная мелодия.</div></div>
<div id="tab7" class="tab-content"><div class="execution">Секретный файл: Monokuma боится этого персонажа.</div></div>
<footer style="text-align:center; margin-top:20px;">⬤ DR: СОЗДАНО ИЗ ПРОМПТА</footer>
</div><script>
const btns=document.querySelectorAll('.tab-btn');
const contents=document.querySelectorAll('.tab-content');
btns.forEach(btn=>{btn.addEventListener('click',()=>{let target=btn.getAttribute('data-tab');btns.forEach(b=>b.classList.remove('active'));contents.forEach(c=>c.classList.remove('active'));btn.classList.add('active');document.getElementById(target).classList.add('active');});});
<\/script></body></html>`;
    }
    function getAvatar(name) {
        let first = name.charAt(0).toUpperCase();
        let avatars = { 'И':'⚡', 'К':'🔧', 'Т':'🎮', 'С':'🎵', 'М':'🎭' };
        return avatars[first] || '⭐';
    }
    function saveCharacter(character) {
        let chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        chars = chars.filter(c => c.name !== character.name);
        chars.push(character);
        localStorage.setItem('customCharacters', JSON.stringify(chars));
        return true;
    }
    function generateAndSave() {
        let text = document.getElementById('promptInput').value.trim();
        if (!text) { alert('Введите промпт!'); return; }
        let data = parsePrompt(text);
        let html = generateCharacterHTML(data);
        let character = {
            name: data.name,
            talent: data.talent,
            phrase: data.phrase,
            htmlContent: html,
            avatar: getAvatar(data.name)
        };
        if (saveCharacter(character)) {
            let previewDiv = document.getElementById('characterPreview');
            previewDiv.innerHTML = `<div class="preview-card"><div class="preview-avatar">${character.avatar}</div><div class="preview-name" style="font-size:20px; font-weight:bold;">${character.name.toUpperCase()}</div><div class="preview-talent" style="color:#ffcc88;">${character.talent}</div><div class="preview-tag" style="background:#000000aa; padding:4px 12px; border-radius:30px; margin-top:10px;">${character.phrase.substring(0,35)}...</div></div><div style="background:#1a1a1a; padding:12px; border-radius:16px; margin-top:15px;"><strong>✅ Сохранено!</strong><br>Имя: ${character.name}<br>Талант: ${character.talent}</div>`;
            document.getElementById('resultArea').style.display = 'block';
            showToast(`✅ Персонаж "${character.name}" добавлен в меню!`);
        } else { showToast('Ошибка сохранения'); }
    }
    document.getElementById('exampleBtn').onclick = () => {
        document.getElementById('promptInput').value = `Имя: Иван Диогенов
Талант: Бета-тестер Реальности
Фирменная фраза: «Интересный ход… но у меня есть пасхалки»
Аксессуар: браслет, взламывающий системные файлы
Внешность: школьная форма, картридж вместо галстука, чёрно-красная гамма
Характер: говорит короткими фразами, использует слова «баг», «промпт», «код»
Тайна: читает исходный код игры, Monokuma боится его
Название казни: «Жестокая отладка»
Описание казни: Monokuma запускает Windows 95, команда kill -9 не срабатывает
Фраза перед казнью: «Я сохранил лог. В следующем прохождении я выиграю»
Улика: обрывок системного лога Monokuma о промпт-ограничениях`;
        showToast('Пример загружен');
    };
    document.getElementById('generateBtn').onclick = generateAndSave;
    document.getElementById('goToMenuBtn').onclick = () => window.location.href = 'index.html';
    document.getElementById('generateAnotherBtn').onclick = () => {
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('promptInput').value = '';
        document.getElementById('promptInput').focus();
    };
</script>
</body>
</html>
