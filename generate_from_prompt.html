<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Генератор персонажа | Danganronpa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', 'Segoe UI', monospace;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .crt {
            max-width: 1200px;
            width: 100%;
            margin: auto;
            background: #0a0a0a;
            border: 8px solid #3a2a2a;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        h1 {
            text-align: center;
            font-size: clamp(32px, 8vw, 46px);
            color: #ff8866;
            text-shadow: 0 0 6px #ff4422, 2px 2px 0 #3a1a1a;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .sub {
            text-align: center;
            color: #dd8888;
            font-size: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #aa5544;
            padding-bottom: 15px;
            font-weight: bold;
        }
        .question {
            background: #111111cc;
            border-left: 6px solid #d45a2e;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        label {
            display: block;
            font-weight: bold;
            color: #ffccaa;
            margin-bottom: 12px;
            font-size: 20px;
            letter-spacing: 1px;
        }
        input, select, textarea {
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #aa5544;
            color: #f0e0d0;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            border-radius: 16px;
            transition: all 0.2s;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ff8866;
            outline: none;
            box-shadow: 0 0 10px #ff6644;
        }
        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 8px;
        }
        .radio-group label, .checkbox-group label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            font-size: 18px;
            color: #ddbb88;
            cursor: pointer;
            background: #1a1a1a66;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #aa5544;
            transition: 0.2s;
        }
        .radio-group label:hover, .checkbox-group label:hover {
            background: #2a2a2a;
            border-color: #ff8866;
        }
        .radio-group input, .checkbox-group input {
            width: auto;
            transform: scale(1.2);
            margin-right: 5px;
            accent-color: #ff6644;
        }
        button {
            background: #2a1a1a;
            border: 2px solid #aa6644;
            color: #ffccaa;
            padding: 16px;
            font-family: monospace;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 60px;
            transition: all 0.2s;
            margin-top: 25px;
            letter-spacing: 2px;
        }
        button:hover {
            background: #4a2a2a;
            box-shadow: 0 0 15px #ff8866;
            transform: scale(1.01);
        }
        .result-area {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px dashed #aa5544;
            display: none;
        }
        .result-header {
            color: #88ff88;
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
            text-shadow: 0 0 6px #00aa00;
        }
        .preview-card {
            background: #1a1f1aee;
            border: 2px solid #ffaa66;
            border-radius: 32px;
            width: 280px;
            padding: 20px;
            margin: 0 auto 20px;
            text-align: center;
        }
        .preview-avatar { font-size: 80px; margin-bottom: 10px; }
        .preview-name { font-size: 26px; font-weight: bold; color: #ffeebb; }
        .preview-talent { font-size: 16px; color: #ffcc88; margin-top: 8px; }
        .preview-tag { background: #000000aa; display: inline-block; padding: 6px 16px; border-radius: 40px; margin-top: 12px; font-size: 13px; color: #ffdd99; }
        .dossier {
            background: #0a0a0a;
            border: 2px solid #aa5544;
            border-radius: 24px;
            overflow: hidden;
            margin-top: 20px;
        }
        .dossier-header {
            background: #2a1a1a;
            padding: 15px 20px;
            border-bottom: 2px solid #aa5544;
        }
        .dossier-header h2 {
            color: #ffaa88;
            font-size: 24px;
            margin: 0;
        }
        .dossier-section {
            padding: 20px;
            border-bottom: 1px solid #3a2a2a;
        }
        .dossier-section:last-child {
            border-bottom: none;
        }
        .dossier-section h3 {
            color: #ffcc88;
            font-size: 20px;
            margin-bottom: 12px;
            border-left: 4px solid #ff6644;
            padding-left: 12px;
        }
        .dossier-section p {
            font-size: 16px;
            line-height: 1.5;
            color: #e0d0c0;
        }
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #2a4a2a;
            color: #cfeca8;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 3s forwards;
            box-shadow: 0 0 12px #88ff88;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; transform: translateY(20px); }
        }
        .main-link {
            display: inline-block;
            background: #1a2a1a;
            color: #ccffaa;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 18px;
            margin-bottom: 25px;
            transition: 0.2s;
            border: 1px solid #66aa66;
        }
        .main-link:hover {
            background: #2a4a2a;
            box-shadow: 0 0 12px #88ff88;
        }
        .success-buttons {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }
        .success-buttons button {
            margin-top: 0;
            width: auto;
            padding: 12px 28px;
            font-size: 18px;
        }
        .note {
            margin-top: 30px;
            color: #aa8866;
            text-align: center;
            font-size: 15px;
            border-top: 1px solid #5a3a2a;
            padding-top: 20px;
        }
        @media (max-width: 700px) {
            .crt { padding: 20px; }
            button { font-size: 18px; }
            .preview-card { width: 260px; }
            .question label { font-size: 18px; }
            input, select { font-size: 16px; }
            .radio-group label, .checkbox-group label { font-size: 14px; padding: 5px 10px; }
            .dossier-section h3 { font-size: 18px; }
            .dossier-section p { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="crt">
    <a href="index.html" class="main-link">🏠 НА ГЛАВНУЮ</a>
    <h1>⚡ СОЗДАЙ СВОЕГО ПЕРСОНАЖА ⚡</h1>
    <div class="sub">20 вопросов – твои ответы определят роль, талант, характер и судьбу</div>

    <!-- 20 вопросов (без отдельного вопроса о судьбе) -->
    <div class="question"><label>1. Имя персонажа:</label><input type="text" id="name" placeholder="например: Иван Диогенов"></div>
    <div class="question"><label>2. Талант (Ultimate):</label><input type="text" id="talent" placeholder="например: Стратег, Детектив, Боец"></div>
    <div class="question"><label>3. Любимый цвет:</label><select id="color"><option value="red">Красный – страсть и решимость</option><option value="black">Чёрный – тайна и элегантность</option><option value="blue">Синий – холодный ум</option><option value="green">Зелёный – гармония</option><option value="purple">Фиолетовый – загадочность</option><option value="white">Белый – чистота и правда</option></select></div>
    <div class="question"><label>4. Любимая еда:</label><input type="text" id="food" placeholder="например: пицца, рамэн, донатс"></div>
    <div class="question"><label>5. Хобби:</label><input type="text" id="hobby" placeholder="например: чтение, спорт, рисование"></div>
    <div class="question"><label>6. Сильная черта характера:</label><select id="strength"><option value="ум">Острый ум</option><option value="сила">Физическая сила</option><option value="харизма">Харизма</option><option value="креативность">Креативность</option><option value="терпение">Терпение</option><option value="хитрость">Хитрость</option></select></div>
    <div class="question"><label>7. Стиль речи:</label><select id="speech"><option value="короткий">Коротко, по делу</option><option value="длинный">Длинные монологи</option><option value="загадочный">Загадочно, с намёками</option><option value="ироничный">Ироничный, с сарказмом</option><option value="тихий">Тихий, почти шёпот</option></select></div>
    <div class="question"><label>8. Отношение к Monokuma:</label><select id="monokuma"><option value="страх">Боюсь, но не подаю виду</option><option value="ненависть">Ненавижу, хочу уничтожить</option><option value="интерес">Интересуюсь его тайнами</option><option value="равнодушие">Мне всё равно</option><option value="манипуляция">Пытаюсь манипулировать им</option></select></div>
    <div class="question"><label>9. Внешность (кратко):</label><textarea id="look" rows="2" placeholder="например: высокий, светлые волосы, очки"></textarea></div>
    <div class="question"><label>10. Тайна (что скрываешь?):</label><textarea id="secret" rows="2" placeholder="например: тёмное прошлое, запрещённый предмет"></textarea></div>
    <div class="question"><label>11. Любимое время суток:</label><select id="time"><option value="утро">Утро</option><option value="день">День</option><option value="вечер">Вечер</option><option value="ночь">Ночь</option></select></div>
    <div class="question"><label>12. Что ты ценишь в людях больше всего?</label><select id="value"><option value="честность">Честность</option><option value="сила">Силу</option><option value="ум">Ум</option><option value="верность">Верность</option><option value="хитрость">Хитрость</option><option value="доброта">Доброту</option></select></div>
    <div class="question"><label>13. Твой самый большой страх:</label><input type="text" id="fear" placeholder="например: потерять близких"></div>
    <div class="question"><label>14. Какое у тебя хобби, о котором никто не знает?</label><input type="text" id="secretHobby" placeholder="например: коллекционирование марок"></div>
    <div class="question"><label>15. Ты скорее...</label><select id="moral"><option value="добро">Поможешь другу, даже рискуя собой</option><option value="зло">Спасёшь себя, даже если придётся предать</option><option value="нейтрал">Поступлю по обстоятельствам</option><option value="расчёт">Помогу, но с выгодой для себя</option></select></div>
    <div class="question"><label>16. Что ты обычно делаешь в одиночестве?</label><input type="text" id="alone" placeholder="например: читаю, тренируюсь"></div>
    <div class="question"><label>17. Твоя самая заметная привычка:</label><input type="text" id="habit" placeholder="например: крутить волосы, поправлять галстук"></div>
    <div class="question"><label>18. Какую роль ты предпочёл бы в группе?</label><select id="roleGroup"><option value="лидер">Лидер</option><option value="аналитик">Аналитик</option><option value="боец">Боец</option><option value="тыл">Поддержка</option><option value="шпион">Шпион/диверсант</option></select></div>
    <div class="question"><label>19. Твой любимый предмет в школе:</label><input type="text" id="subject" placeholder="например: история, физика"></div>
    <div class="question"><label>20. Как ты поступишь, если увидишь, что кто-то совершает преступление?</label><select id="crime"><option value="сообщу">Сообщу Monokuma или другим</option><option value="остановлю">Попытаюсь остановить сам</option><option value="скрою">Скрою, если это выгодно</option><option value="использую">Использую это как рычаг давления</option></select></div>

    <button id="generateBtn">✨ СОЗДАТЬ УНИКАЛЬНОГО ПЕРСОНАЖА ✨</button>
    <div id="resultArea" class="result-area"><div class="result-header">✅ ПЕРСОНАЖ СОЗДАН</div><div id="characterPreview"></div><div class="success-buttons"><button id="goToMenuBtn">🏠 В МЕНЮ</button><button id="generateAnotherBtn">🔄 ЕЩЁ</button></div></div>
    <div class="note">✨ Роль (убийца/жертва/выживший) вычисляется на основе всех ответов. Каждый персонаж уникален.</div>
</div>

<script>
    function showToast(msg) { let t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

    // Функция определения роли на основе комбинации ответов
    function determineFate(answers) {
        let scoreKiller = 0, scoreVictim = 0, scoreSurvivor = 0;
        // Влияние сильной черты
        if(answers.strength === 'хитрость') scoreKiller += 2;
        if(answers.strength === 'сила') scoreKiller += 1;
        if(answers.strength === 'ум') scoreSurvivor += 1;
        if(answers.strength === 'терпение') scoreSurvivor += 2;
        // Влияние морали
        if(answers.moral === 'зло') scoreKiller += 3;
        if(answers.moral === 'расчёт') scoreKiller += 1;
        if(answers.moral === 'добро') scoreVictim += 2;
        if(answers.moral === 'нейтрал') scoreSurvivor += 2;
        // Отношение к Monokuma
        if(answers.monokumaFeel === 'ненависть') scoreKiller += 2;
        if(answers.monokumaFeel === 'манипуляция') scoreKiller += 1;
        if(answers.monokumaFeel === 'страх') scoreVictim += 1;
        if(answers.monokumaFeel === 'равнодушие') scoreSurvivor += 1;
        // Реакция на преступление
        if(answers.crime === 'скрою') scoreKiller += 2;
        if(answers.crime === 'использую') scoreKiller += 1;
        if(answers.crime === 'остановлю') scoreVictim += 1;
        if(answers.crime === 'сообщу') scoreSurvivor += 1;
        // Роль в группе
        if(answers.roleGroup === 'шпион') scoreKiller += 1;
        if(answers.roleGroup === 'лидер') scoreSurvivor += 1;
        if(answers.roleGroup === 'тыл') scoreVictim += 1;
        // Ценности
        if(answers.value === 'хитрость') scoreKiller += 1;
        if(answers.value === 'доброта') scoreVictim += 1;
        if(answers.value === 'ум') scoreSurvivor += 1;
        // Определение
        if(scoreKiller > scoreVictim && scoreKiller > scoreSurvivor) return 'killer';
        if(scoreVictim > scoreKiller && scoreVictim > scoreSurvivor) return 'victim';
        return 'survivor';
    }

    function generateCharacter() {
        const name = document.getElementById('name').value.trim();
        if(!name){ alert('Введите имя!'); return null; }
        const talent = document.getElementById('talent').value.trim() || 'Неизвестный талант';
        const color = document.getElementById('color').value;
        const food = document.getElementById('food').value.trim() || 'неизвестное блюдо';
        const hobby = document.getElementById('hobby').value.trim() || 'неизвестное хобби';
        const strength = document.getElementById('strength').value;
        const speech = document.getElementById('speech').value;
        const monokumaFeel = document.getElementById('monokuma').value;
        let customLook = document.getElementById('look').value.trim();
        let secret = document.getElementById('secret').value.trim();
        const time = document.getElementById('time').value;
        const value = document.getElementById('value').value;
        const fear = document.getElementById('fear').value.trim() || 'неизвестный страх';
        const secretHobby = document.getElementById('secretHobby').value.trim() || 'неизвестное тайное хобби';
        const moral = document.getElementById('moral').value;
        const alone = document.getElementById('alone').value.trim() || 'размышляет';
        const habit = document.getElementById('habit').value.trim() || 'поправляет одежду';
        const roleGroup = document.getElementById('roleGroup').value;
        const subject = document.getElementById('subject').value.trim() || 'неизвестный предмет';
        const crime = document.getElementById('crime').value;

        // Определяем роль
        const answers = { strength, moral, monokumaFeel, crime, roleGroup, value };
        const fate = determineFate(answers);

        // Фирменная фраза (усложнённая)
        let phrase = '';
        if(color === 'red') phrase = `«${food} — моя страсть, а ${hobby} — моё призвание. Не путайся под ногами.»`;
        else if(color === 'black') phrase = `«В тени я вижу то, что другие не замечают. Например, твой страх перед ${food}.»`;
        else if(color === 'blue') phrase = `«Логика и ${hobby} — вот ключ к победе. А ${food} — приятный бонус.»`;
        else if(color === 'green') phrase = `«Природа и ${hobby} дают мне силу. Но ${food} — моя слабость.»`;
        else if(color === 'purple') phrase = `«Загадки и ${hobby} — моя стихия. ${food} — лишь отвлекающий манёвр.»`;
        else phrase = `«Чистота и правда — вот моё оружие. ${food} и ${hobby} помогают мне.»`;

        // Внешность
        let appearance = customLook;
        if (!appearance) {
            const looks = {
                red: `Яркая красная одежда, дерзкий взгляд, часто поправляет волосы.`,
                black: `Всё чёрное, скрытный стиль, носит перчатки.`,
                blue: `Синяя униформа, очки, всегда с блокнотом.`,
                green: `Спокойный природный образ, любит ${hobby}.`,
                purple: `Фиолетовая шляпа и плащ, загадочный акцент.`,
                white: `Безупречный белый костюм, стремится к идеалу.`
            };
            appearance = looks[color] || `Необычный стиль, выделяется среди других.`;
        }
        appearance += ` Любит ${time}, ценит в людях ${value}. Его привычка — ${habit}. В одиночестве ${alone}.`;

        // Характер
        let personality = '';
        if(speech === 'короткий') personality = `Говорит рублеными фразами, не терпит пустословия. ${strength==='ум'?'Анализирует всё вокруг.':strength==='сила'?'Решает проблемы кулаками.':strength==='харизма'?'Всегда знает, что сказать.':'Креативен и нестандартен.'}`;
        else if(speech === 'длинный') personality = `Обожает долгие монологи, любит поучать. ${strength==='харизма'?'Его слушают с открытым ртом.':'Его трудно перебить.'}`;
        else if(speech === 'загадочный') personality = `Говорит загадками, делает паузы для эффекта. ${strength==='креативность'?'Его идеи пугают.':'Всегда оставляет загадку.'}`;
        else if(speech === 'ироничный') personality = `Говорит с иронией, часто использует сарказм. ${strength==='ум'?'Остроумен и язвителен.':'Скрывает доброту за насмешками.'}`;
        else personality = `Говорит тихо, почти шёпотом. ${strength==='хитрость'?'Его тихий голос скрывает опасные мысли.':'Заставляет других напряжённо вслушиваться.'}`;

        // Тайна (усложнённая)
        if (!secret) {
            if(monokumaFeel === 'страх') secret = `Боится, что Monokuma найдёт в его комнате улики прошлого преступления. Его тайное хобби — ${secretHobby}.`;
            else if(monokumaFeel === 'ненависть') secret = `Планирует взорвать всю Академию вместе с Monokuma. Уже спрятал взрывчатку. Его тайное хобби — ${secretHobby}.`;
            else if(monokumaFeel === 'интерес') secret = `Изучает тёмную историю Академии, нашёл старые протоколы экспериментов. А ещё ${secretHobby}.`;
            else if(monokumaFeel === 'манипуляция') secret = `Пытается манипулировать Monokuma, собирая компромат на него. Тайно ${secretHobby}.`;
            else secret = `Хранит дневник, в котором описаны его страхи. Самый большой страх — ${fear}. Также он тайно ${secretHobby}.`;
        }

        // ---- Генерация судьбы (роли) и связанных элементов ----
        let role='', execName='', execDesc='', lastWords='', evidence='';
        if(fate === 'killer') {
            role = '🔪 Убийца';
            execName = `${speech === 'короткий' ? 'Кровавая расплата' : (speech === 'длинный' ? 'Монолог смерти' : (speech === 'загадочный' ? 'Лабиринт отчаяния' : (speech === 'ироничный' ? 'Саркастичный финал' : 'Тихая смерть')))}`;
            execDesc = `Monokuma заставляет ${name} сражаться со своими страхами. В конце концов, ${speech === 'короткий' ? 'он принимает смерть молча' : (speech === 'длинный' ? 'произносит прощальную речь' : (speech === 'загадочный' ? 'исчезает в неизвестности' : (speech === 'ироничный' ? 'уходит с усмешкой' : 'умирает без единого звука')))}. ${strength === 'креативность' ? 'Но перед этим успевает оставить зашифрованное послание.' : ''} ${strength === 'хитрость' ? 'Он долго готовил эту казнь, но она обернулась против него.' : ''}`;
            lastWords = `«${phrase} Я не жалею ни о чём. Такова плата за отчаяние.»`;
            evidence = `На месте преступления найдена улика, связанная с ${hobby} и ${secretHobby}.`;
        } else if(fate === 'victim') {
            role = '🕯️ Жертва';
            execName = `Несчастный случай`;
            execDesc = `${name} найден мёртвым в своей комнате. Причина смерти – ${hobby.toLowerCase()} пошло не так. ${monokumaFeel === 'ненависть' ? 'Рядом обнаружена записка с угрозами от Monokuma.' : ''} ${moral === 'добро' ? 'Он пытался защитить другого ученика.' : ''}`;
            lastWords = `«Я не хотел... это всё из-за ${food}...»`;
            evidence = `Предсмертная записка, в которой упоминается ${monokumaFeel === 'страх' ? 'Monokuma' : 'некто в тени'}. Также найдены следы ${secretHobby}.`;
        } else {
            role = '🏆 Выживший';
            execName = `Побег из ада`;
            execDesc = `${name} использует своё ${strength}, чтобы сбежать из игровой зоны, оставив Monokuma в бешенстве. ${hobby} и ${food} помогают ему в этом. ${roleGroup === 'лидер' ? 'Он уводит за собой других.' : roleGroup === 'шпион' ? 'Он использует украденные данные, чтобы выбраться.' : 'Он действует в одиночку.'}`;
            lastWords = `«Я выжил, чтобы рассказать правду. И ${food} мне в этом помогло!»`;
            evidence = `Пустой дневник и билет на эвакуацию.`;
        }

        // История, отношения, навыки (более детальные)
        const backstory = `${name} вырос в ${color === 'red' ? 'семье военных' : color === 'black' ? 'аристократической семье' : color === 'white' ? 'семье священников' : 'обычной семье'}. С детства проявлял ${talent.toLowerCase()} и мечтал использовать это для борьбы с отчаянием. Однажды случайно ${hobby} изменило его жизнь. Его любимый школьный предмет — ${subject}. ${crime === 'скрою' ? 'Он уже сталкивался с преступлениями и предпочитает молчать.' : crime === 'остановлю' ? 'Он всегда ввязывается в драки, защищая слабых.' : 'Он знает цену правосудию.'}`;
        const relationships = `Monokuma: ${monokumaFeel === 'страх' ? 'боится, но притворяется смелым' : monokumaFeel === 'ненависть' ? 'открытый враг' : monokumaFeel === 'интерес' ? 'тайный исследователь' : monokumaFeel === 'манипуляция' ? 'пытается переиграть' : 'равнодушен'}. Другие ученики: ${value === 'честность' ? 'ценят его за правдивость' : (value === 'сила' ? 'уважают его физическую мощь' : (value === 'ум' ? 'прислушиваются к его советам' : (value === 'верность' ? 'доверяют ему' : (value === 'хитрость' ? 'побаиваются его' : 'считают его добрым'))))}. ${moral === 'добро' ? 'Он всегда готов прийти на помощь.' : (moral === 'зло' ? 'Он думает только о себе.' : (moral === 'расчёт' ? 'Он помогает, когда это выгодно.' : 'Он поступает по обстоятельствам.'))}`;
        const skills = `${talent}, ${hobby}, ${secretHobby}, ${strength}. Также умеет готовить ${food}.`;
        const weaknesses = `Не переносит ${speech === 'короткий' ? 'длинных объяснений' : 'молчания'}. Боится ${fear}. Может проявить ${moral === 'добро' ? 'излишнюю доверчивость' : (moral === 'зло' ? 'жестокость' : (moral === 'расчёт' ? 'цинизм' : 'нерешительность'))}.`;

        // Аватар
        const avatar = color === 'red' ? '🔥' : (color === 'black' ? '🖤' : (color === 'blue' ? '💧' : (color === 'green' ? '🍃' : (color === 'purple' ? '🔮' : '🤍'))));

        return { name, talent, phrase, avatar, appearance, personality, secret, execName, execDesc, lastWords, evidence, role, backstory, relationships, skills, weaknesses };
    }

    function saveToLocalStorage(character) {
        let chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        chars = chars.filter(c => c.name !== character.name);
        chars.push(character);
        localStorage.setItem('customCharacters', JSON.stringify(chars));
    }

    function generateAndSave() {
        const char = generateCharacter();
        if(!char) return;
        saveToLocalStorage(char);
        const previewDiv = document.getElementById('characterPreview');
        previewDiv.innerHTML = `
            <div class="preview-card">
                <div class="preview-avatar">${char.avatar}</div>
                <div class="preview-name">${char.name.toUpperCase()}</div>
                <div class="preview-talent">${char.talent}</div>
                <div class="preview-tag">${char.phrase}</div>
            </div>
            <div class="dossier">
                <div class="dossier-header"><h2>📁 ДОСЬЕ ПЕРСОНАЖА</h2></div>
                <div class="dossier-section"><h3>Основная информация</h3><p>Имя: ${char.name}<br>Талант: ${char.talent}<br>Роль: ${char.role}<br>Фирменная фраза: ${char.phrase}</p></div>
                <div class="dossier-section"><h3>Внешность</h3><p>${char.appearance}</p></div>
                <div class="dossier-section"><h3>Характер</h3><p>${char.personality}</p></div>
                <div class="dossier-section"><h3>История</h3><p>${char.backstory}</p></div>
                <div class="dossier-section"><h3>Отношения с другими</h3><p>${char.relationships}</p></div>
                <div class="dossier-section"><h3>Навыки и слабости</h3><p>${char.skills}<br><strong>Слабости:</strong> ${char.weaknesses}</p></div>
                <div class="dossier-section"><h3>Тайна</h3><p>${char.secret}</p></div>
                <div class="dossier-section"><h3>Судьба / Казнь</h3><p>${char.execName}<br>${char.execDesc}<br><strong>Последние слова:</strong> ${char.lastWords}<br><strong>Улика:</strong> ${char.evidence}</p></div>
            </div>
        `;
        document.getElementById('resultArea').style.display = 'block';
        showToast(`✅ "${char.name}" добавлен в меню!`);
    }

    document.getElementById('generateBtn').onclick = generateAndSave;
    document.getElementById('goToMenuBtn').onclick = () => window.location.href = 'index.html';
    document.getElementById('generateAnotherBtn').onclick = () => {
        document.getElementById('resultArea').style.display = 'none';
        const ids = ['name','talent','food','hobby','look','secret','fear','secretHobby','alone','habit','subject'];
        ids.forEach(id => document.getElementById(id).value = '');
        document.getElementById('color').selectedIndex = 0;
        document.getElementById('strength').selectedIndex = 0;
        document.getElementById('speech').selectedIndex = 0;
        document.getElementById('monokuma').selectedIndex = 0;
        document.getElementById('time').selectedIndex = 0;
        document.getElementById('value').selectedIndex = 0;
        document.getElementById('moral').selectedIndex = 0;
        document.getElementById('roleGroup').selectedIndex = 0;
        document.getElementById('crime').selectedIndex = 0;
        showToast('🔄 Форма очищена');
    };
</script>
</body>
</html>
