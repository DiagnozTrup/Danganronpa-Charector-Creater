<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Генератор персонажа | Danganronpa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', 'Segoe UI', monospace;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .crt {
            max-width: 1200px;
            width: 100%;
            margin: auto;
            background: #0a0a0a;
            border: 8px solid #3a2a2a;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        h1 {
            text-align: center;
            font-size: clamp(32px, 8vw, 46px);
            color: #ff8866;
            text-shadow: 0 0 6px #ff4422, 2px 2px 0 #3a1a1a;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .sub {
            text-align: center;
            color: #dd8888;
            font-size: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #aa5544;
            padding-bottom: 15px;
            font-weight: bold;
        }
        .question {
            background: #111111cc;
            border-left: 6px solid #d45a2e;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        label {
            display: block;
            font-weight: bold;
            color: #ffccaa;
            margin-bottom: 12px;
            font-size: 20px;
            letter-spacing: 1px;
        }
        input, select, textarea {
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #aa5544;
            color: #f0e0d0;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            border-radius: 16px;
            transition: all 0.2s;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ff8866;
            outline: none;
            box-shadow: 0 0 10px #ff6644;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 8px;
        }
        .radio-group label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            font-size: 18px;
            color: #ddbb88;
            cursor: pointer;
            background: #1a1a1a66;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #aa5544;
            transition: 0.2s;
        }
        .radio-group label:hover {
            background: #2a2a2a;
            border-color: #ff8866;
        }
        .radio-group input {
            width: auto;
            transform: scale(1.2);
            margin-right: 5px;
            accent-color: #ff6644;
        }
        button {
            background: #2a1a1a;
            border: 2px solid #aa6644;
            color: #ffccaa;
            padding: 16px;
            font-family: monospace;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 60px;
            transition: all 0.2s;
            margin-top: 25px;
            letter-spacing: 2px;
        }
        button:hover {
            background: #4a2a2a;
            box-shadow: 0 0 15px #ff8866;
            transform: scale(1.01);
        }
        .result-area {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px dashed #aa5544;
            display: none;
        }
        .result-header {
            color: #88ff88;
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
            text-shadow: 0 0 6px #00aa00;
        }
        .preview-card {
            background: #1a1f1aee;
            border: 2px solid #ffaa66;
            border-radius: 32px;
            width: 280px;
            padding: 20px;
            margin: 0 auto 20px;
            text-align: center;
        }
        .preview-avatar { font-size: 80px; margin-bottom: 10px; }
        .preview-name { font-size: 26px; font-weight: bold; color: #ffeebb; }
        .preview-talent { font-size: 16px; color: #ffcc88; margin-top: 8px; }
        .preview-tag { background: #000000aa; display: inline-block; padding: 6px 16px; border-radius: 40px; margin-top: 12px; font-size: 13px; color: #ffdd99; }
        .dossier {
            background: #0a0a0a;
            border: 2px solid #aa5544;
            border-radius: 24px;
            overflow: hidden;
            margin-top: 20px;
        }
        .dossier-header {
            background: #2a1a1a;
            padding: 15px 20px;
            border-bottom: 2px solid #aa5544;
        }
        .dossier-header h2 {
            color: #ffaa88;
            font-size: 24px;
            margin: 0;
        }
        .dossier-section {
            padding: 20px;
            border-bottom: 1px solid #3a2a2a;
        }
        .dossier-section:last-child {
            border-bottom: none;
        }
        .dossier-section h3 {
            color: #ffcc88;
            font-size: 20px;
            margin-bottom: 12px;
            border-left: 4px solid #ff6644;
            padding-left: 12px;
        }
        .dossier-section p {
            font-size: 16px;
            line-height: 1.5;
            color: #e0d0c0;
        }
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #2a4a2a;
            color: #cfeca8;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 3s forwards;
            box-shadow: 0 0 12px #88ff88;
        }
        .prompt-box {
            background: #0a0a0a;
            border: 2px solid #ffaa66;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
        }
        .prompt-box h3 {
            color: #ffcc88;
            margin-bottom: 15px;
        }
        .prompt-text {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 16px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 14px;
            color: #f0e0d0;
            border-left: 4px solid #ffaa66;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; transform: translateY(20px); }
        }
        .main-link {
            display: inline-block;
            background: #1a2a1a;
            color: #ccffaa;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 18px;
            margin-bottom: 25px;
            transition: 0.2s;
            border: 1px solid #66aa66;
        }
        .main-link:hover {
            background: #2a4a2a;
            box-shadow: 0 0 12px #88ff88;
        }
        .success-buttons {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }
        .success-buttons button {
            margin-top: 0;
            width: auto;
            padding: 12px 28px;
            font-size: 18px;
        }
        .note {
            margin-top: 30px;
            color: #aa8866;
            text-align: center;
            font-size: 15px;
            border-top: 1px solid #5a3a2a;
            padding-top: 20px;
        }
        @media (max-width: 700px) {
            .crt { padding: 20px; }
            button { font-size: 18px; }
            .preview-card { width: 260px; }
            .question label { font-size: 18px; }
            input, select { font-size: 16px; }
            .radio-group label { font-size: 14px; padding: 5px 10px; }
            .dossier-section h3 { font-size: 18px; }
            .dossier-section p { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="crt">
    <a href="index.html" class="main-link">🏠 НА ГЛАВНУЮ</a>
    <h1>⚡ СОЗДАЙ СВОЕГО ПЕРСОНАЖА ⚡</h1>
    <div class="sub">20 вопросов – твои ответы определят роль, талант, характер и судьбу</div>

    <!-- 20 вопросов -->
    <div class="question"><label>1. Имя персонажа:</label><input type="text" id="name" placeholder="например: Иван Диогенов"></div>
    <div class="question"><label>2. Талант (Ultimate):</label><input type="text" id="talent" placeholder="например: Стратег, Детектив, Боец"></div>
    <div class="question"><label>3. Любимый цвет:</label><select id="color"><option value="red">Красный</option><option value="black">Чёрный</option><option value="blue">Синий</option><option value="green">Зелёный</option><option value="purple">Фиолетовый</option><option value="white">Белый</option></select></div>
    <div class="question"><label>4. Любимая еда:</label><input type="text" id="food" placeholder="например: пицца"></div>
    <div class="question"><label>5. Хобби:</label><input type="text" id="hobby" placeholder="например: чтение"></div>
    <div class="question"><label>6. Сильная черта:</label><select id="strength"><option value="ум">Острый ум</option><option value="сила">Физическая сила</option><option value="харизма">Харизма</option><option value="креативность">Креативность</option><option value="терпение">Терпение</option><option value="хитрость">Хитрость</option></select></div>
    <div class="question"><label>7. Стиль речи:</label><select id="speech"><option value="короткий">Коротко, по делу</option><option value="длинный">Длинные монологи</option><option value="загадочный">Загадочно</option><option value="ироничный">Ироничный</option><option value="тихий">Тихий</option></select></div>
    <div class="question"><label>8. Отношение к Monokuma:</label><select id="monokuma"><option value="страх">Боюсь, но не подаю виду</option><option value="ненависть">Ненавижу</option><option value="интерес">Интересуюсь</option><option value="равнодушие">Мне всё равно</option><option value="манипуляция">Пытаюсь манипулировать</option></select></div>
    <div class="question"><label>9. Внешность (кратко):</label><textarea id="look" rows="2" placeholder="например: высокий, светлые волосы"></textarea></div>
    <div class="question"><label>10. Тайна:</label><textarea id="secret" rows="2" placeholder="например: тёмное прошлое"></textarea></div>
    <div class="question"><label>11. Любимое время суток:</label><select id="time"><option value="утро">Утро</option><option value="день">День</option><option value="вечер">Вечер</option><option value="ночь">Ночь</option></select></div>
    <div class="question"><label>12. Что ценишь в людях?</label><select id="value"><option value="честность">Честность</option><option value="сила">Силу</option><option value="ум">Ум</option><option value="верность">Верность</option><option value="хитрость">Хитрость</option><option value="доброта">Доброту</option></select></div>
    <div class="question"><label>13. Самый большой страх:</label><input type="text" id="fear" placeholder="например: темнота"></div>
    <div class="question"><label>14. Тайное хобби:</label><input type="text" id="secretHobby" placeholder="например: коллекционирование"></div>
    <div class="question"><label>15. Ты скорее...</label><select id="moral"><option value="добро">Поможешь другу</option><option value="зло">Спасёшь себя</option><option value="нейтрал">Поступлю по обстоятельствам</option><option value="расчёт">Помогу с выгодой</option></select></div>
    <div class="question"><label>16. Что делаешь в одиночестве?</label><input type="text" id="alone" placeholder="например: читаю"></div>
    <div class="question"><label>17. Привычка:</label><input type="text" id="habit" placeholder="например: поправлять галстук"></div>
    <div class="question"><label>18. Роль в группе:</label><select id="roleGroup"><option value="лидер">Лидер</option><option value="аналитик">Аналитик</option><option value="боец">Боец</option><option value="тыл">Поддержка</option><option value="шпион">Шпион</option></select></div>
    <div class="question"><label>19. Любимый предмет в школе:</label><input type="text" id="subject" placeholder="например: история"></div>
    <div class="question"><label>20. Реакция на преступление:</label><select id="crime"><option value="сообщу">Сообщу</option><option value="остановлю">Остановлю</option><option value="скрою">Скрою</option><option value="использую">Использую</option></select></div>

    <button id="generateBtn">✨ СОЗДАТЬ УНИКАЛЬНОГО ПЕРСОНАЖА ✨</button>
    <div id="resultArea" class="result-area">
        <div class="result-header">✅ ПЕРСОНАЖ СОЗДАН</div>
        <div id="characterPreview"></div>
        <div id="visualPromptBox" class="prompt-box" style="margin-top: 20px;"></div>
        <div class="success-buttons">
            <button id="goToMenuBtn">🏠 В МЕНЮ</button>
            <button id="generateAnotherBtn">🔄 ЕЩЁ</button>
            <button id="copyPromptBtn">📋 СКОПИРОВАТЬ ПРОМПТ</button>
        </div>
    </div>
    <div class="note">✨ Генерируются диалоги, Free Time Events, улики, саундтрек, секретный файл, финальный суд и промпт для визуальной карточки.</div>
</div>

<script>
    function showToast(msg) { let t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

    function determineFate(answers) {
        let scoreKiller = 0, scoreVictim = 0, scoreSurvivor = 0;
        if(answers.strength === 'хитрость') scoreKiller += 2;
        if(answers.strength === 'сила') scoreKiller += 1;
        if(answers.strength === 'ум') scoreSurvivor += 1;
        if(answers.strength === 'терпение') scoreSurvivor += 2;
        if(answers.moral === 'зло') scoreKiller += 3;
        if(answers.moral === 'расчёт') scoreKiller += 1;
        if(answers.moral === 'добро') scoreVictim += 2;
        if(answers.moral === 'нейтрал') scoreSurvivor += 2;
        if(answers.monokumaFeel === 'ненависть') scoreKiller += 2;
        if(answers.monokumaFeel === 'манипуляция') scoreKiller += 1;
        if(answers.monokumaFeel === 'страх') scoreVictim += 1;
        if(answers.monokumaFeel === 'равнодушие') scoreSurvivor += 1;
        if(answers.crime === 'скрою') scoreKiller += 2;
        if(answers.crime === 'использую') scoreKiller += 1;
        if(answers.crime === 'остановлю') scoreVictim += 1;
        if(answers.crime === 'сообщу') scoreSurvivor += 1;
        if(answers.roleGroup === 'шпион') scoreKiller += 1;
        if(answers.roleGroup === 'лидер') scoreSurvivor += 1;
        if(answers.roleGroup === 'тыл') scoreVictim += 1;
        if(answers.value === 'хитрость') scoreKiller += 1;
        if(answers.value === 'доброта') scoreVictim += 1;
        if(answers.value === 'ум') scoreSurvivor += 1;
        if(scoreKiller > scoreVictim && scoreKiller > scoreSurvivor) return 'killer';
        if(scoreVictim > scoreKiller && scoreVictim > scoreSurvivor) return 'victim';
        return 'survivor';
    }

    function generateCharacter() {
        const name = document.getElementById('name').value.trim();
        if(!name){ alert('Введите имя!'); return null; }
        const talent = document.getElementById('talent').value.trim() || 'Неизвестный талант';
        const color = document.getElementById('color').value;
        const food = document.getElementById('food').value.trim() || 'неизвестное блюдо';
        const hobby = document.getElementById('hobby').value.trim() || 'неизвестное хобби';
        const strength = document.getElementById('strength').value;
        const speech = document.getElementById('speech').value;
        const monokumaFeel = document.getElementById('monokuma').value;
        let customLook = document.getElementById('look').value.trim();
        let secret = document.getElementById('secret').value.trim();
        const time = document.getElementById('time').value;
        const value = document.getElementById('value').value;
        const fear = document.getElementById('fear').value.trim() || 'неизвестный страх';
        const secretHobby = document.getElementById('secretHobby').value.trim() || 'неизвестное тайное хобби';
        const moral = document.getElementById('moral').value;
        const alone = document.getElementById('alone').value.trim() || 'размышляет';
        const habit = document.getElementById('habit').value.trim() || 'поправляет одежду';
        const roleGroup = document.getElementById('roleGroup').value;
        const subject = document.getElementById('subject').value.trim() || 'неизвестный предмет';
        const crime = document.getElementById('crime').value;

        const answers = { strength, moral, monokumaFeel, crime, roleGroup, value };
        const fate = determineFate(answers);
        let role = (fate === 'killer') ? 'Убийца' : (fate === 'victim' ? 'Жертва' : 'Выживший');

        // Фирменная фраза
        let phrase = '';
        if(color === 'red') phrase = `«${food} — моя страсть, а ${hobby} — моё призвание.»`;
        else if(color === 'black') phrase = `«В тени я вижу то, что другие не замечают. Например, твой страх перед ${food}.»`;
        else if(color === 'blue') phrase = `«Логика и ${hobby} — вот ключ к победе.»`;
        else if(color === 'green') phrase = `«Природа и ${hobby} дают мне силу. Но ${food} — моя слабость.»`;
        else if(color === 'purple') phrase = `«Загадки и ${hobby} — моя стихия.»`;
        else phrase = `«Чистота и правда — вот моё оружие. ${food} и ${hobby} помогают мне.»`;

        // Внешность
        let appearance = customLook;
        if (!appearance) {
            const looks = { red: 'Яркая красная одежда, дерзкий взгляд.', black: 'Всё чёрное, скрытный стиль.', blue: 'Синяя униформа, очки.', green: 'Спокойный природный образ.', purple: 'Фиолетовая шляпа и плащ.', white: 'Безупречный белый костюм.' };
            appearance = looks[color] || 'Необычный стиль.';
        }
        appearance += ` Любит ${time}, ценит ${value}. Привычка — ${habit}. В одиночестве ${alone}.`;

        // Характер
        let personality = '';
        if(speech === 'короткий') personality = `Говорит рублеными фразами, не терпит пустословия. ${strength==='ум'?'Анализирует всё.':strength==='сила'?'Решает проблемы кулаками.':strength==='харизма'?'Всегда знает, что сказать.':'Креативен.'}`;
        else if(speech === 'длинный') personality = `Обожает долгие монологи. ${strength==='харизма'?'Его слушают.':'Его трудно перебить.'}`;
        else if(speech === 'загадочный') personality = `Говорит загадками. ${strength==='креативность'?'Идеи пугают.':'Всегда оставляет загадку.'}`;
        else if(speech === 'ироничный') personality = `Говорит с иронией. ${strength==='ум'?'Остроумен.':'Скрывает доброту за насмешками.'}`;
        else personality = `Говорит тихо, почти шёпотом. ${strength==='хитрость'?'Скрывает опасные мысли.':'Заставляет вслушиваться.'}`;

        // Тайна
        if (!secret) {
            if(monokumaFeel === 'страх') secret = `Боится, что Monokuma найдёт улики. Тайное хобби — ${secretHobby}.`;
            else if(monokumaFeel === 'ненависть') secret = `Планирует взорвать Академию. Тайное хобби — ${secretHobby}.`;
            else if(monokumaFeel === 'интерес') secret = `Изучает тёмную историю Академии. А ещё ${secretHobby}.`;
            else if(monokumaFeel === 'манипуляция') secret = `Пытается манипулировать Monokuma. Тайно ${secretHobby}.`;
            else secret = `Хранит дневник, где описаны страхи. Самый большой страх — ${fear}. Также ${secretHobby}.`;
        }

        // Казнь
        let execName='', execDesc='', lastWords='', evidence='';
        if(fate === 'killer') {
            execName = `${speech === 'короткий' ? 'Кровавая расплата' : (speech === 'длинный' ? 'Монолог смерти' : 'Лабиринт отчаяния')}`;
            execDesc = `Monokuma заставляет ${name} сражаться со своими страхами. ${speech === 'короткий' ? 'Он принимает смерть молча.' : (speech === 'длинный' ? 'Произносит прощальную речь.' : 'Исчезает в неизвестности.')}`;
            lastWords = `«${phrase} Я не жалею ни о чём.»`;
            evidence = `Улика связана с ${hobby} и ${secretHobby}.`;
        } else if(fate === 'victim') {
            execName = `Несчастный случай`;
            execDesc = `${name} найден мёртвым. Причина – ${hobby} пошло не так.`;
            lastWords = `«Я не хотел... это из-за ${food}...»`;
            evidence = `Предсмертная записка, связанная с ${monokumaFeel}.`;
        } else {
            execName = `Побег из ада`;
            execDesc = `${name} использует ${strength}, чтобы сбежать. ${hobby} и ${food} помогают.`;
            lastWords = `«Я выжил, чтобы рассказать правду.»`;
            evidence = `Пустой дневник и билет на эвакуацию.`;
        }

        // Диалоги (4 сцены)
        const dialogues = [
            `СЦЕНА 1: ПЕРВАЯ ВСТРЕЧА\nMONOKUMA: Ты, должно быть, ${name}? Талант — ${talent}.\n${name}: ${phrase}\nMONOKUMA: ...Ты странный.`,
            `СЦЕНА 2: КЛАССНЫЙ СУД\nMONOKUMA: Время истекает!\n${name}: Улики говорят сами за себя.\nMONOKUMA: ...Ты уверен?`,
            `СЦЕНА 3: FREE TIME EVENT\nДРУГОЙ УЧЕНИК: Эй, ${name}, ты боишься?\n${name}: Страх — это ${fear}. Но я привык.\nДРУГОЙ УЧЕНИК: Понятно.`,
            `СЦЕНА 4: ФИНАЛЬНЫЙ СУД\nMONOKUMA: Твоя судьба решена! Ты ${role}.\n${name}: ${lastWords}\nMONOKUMA: ...Пупупу...`
        ];

        // Free Time Events
        const freeTimeEvents = [
            `«${name} размышляет о ${subject}.»`,
            `«${name} предлагает разделить ${food}.»`,
            `«${name} молча смотрит на ${habit}.»`
        ];

        // Улики (3)
        const evidencesList = [
            `Улика №1: Записка на стене, связанная с ${hobby}.`,
            `Улика №2: Остатки ${food} на месте преступления.`,
            `Улика №3: Скрытый дневник о ${secretHobby}.`
        ];

        // Саундтрек
        const soundtrack = [
            `Основная тема: «${name} no Kage» — джаз и 8-бит.`,
            `Тема расследования: «Mystery Chord» — нервные струнные.`,
            `Тема суда: «Trial of ${name}» — быстрый темп.`,
            `Тема казни: «Fateful End» — жёсткие басы.`
        ];

        const secretFile = `«Ой-ой-ой... ${name} оказался сложнее. Его тайна — ${secret}. Пупупу... Надо быть осторожнее.»`;
        const finalTrial = `${name} признан ${role === 'Убийца' ? 'убийцей' : (role === 'Жертва' ? 'невиновным, но мёртвым' : 'выжившим')}. Monokuma в ярости.`;
        const backstory = `${name} вырос в ${color === 'red' ? 'семье военных' : 'обычной семье'}. С детства проявлял ${talent}. Любит ${hobby}.`;
        const relationships = `Monokuma: ${monokumaFeel}. Другие ученики: ${value === 'честность' ? 'ценят честность' : 'уважают силу'}. ${moral === 'добро' ? 'Всегда готов помочь.' : 'Думает о себе.'}`;
        const skills = `${talent}, ${hobby}, ${secretHobby}. Умеет готовить ${food}.`;
        const weaknesses = `Боится ${fear}. Не переносит ${speech === 'короткий' ? 'длинных объяснений' : 'молчания'}.`;
        const avatar = color === 'red' ? '🔥' : (color === 'black' ? '🖤' : (color === 'blue' ? '💧' : (color === 'green' ? '🍃' : (color === 'purple' ? '🔮' : '🤍'))));

        // Промпт для визуализации
        const visualPrompt = `Создай изображение персонажа в стиле Danganronpa.
Имя: ${name}
Талант: ${talent}
Роль: ${role}
Внешность: ${appearance}
Характер: ${personality}
Любимая еда: ${food}
Хобби: ${hobby}
Цветовая гамма: ${color}
Фирменная фраза: ${phrase}
Эмодзи: ${avatar}
Фон: тёмная школа, мониторы, красные акценты.
Стиль: пиксель-арт, аниме, высокое разрешение.`;

        return {
            name, talent, phrase, avatar, appearance, personality, secret,
            execName, execDesc, lastWords, evidence, role,
            backstory, relationships, skills, weaknesses,
            dialogues, freeTimeEvents, evidencesList, soundtrack, secretFile, finalTrial,
            visualPrompt
        };
    }

    function saveToLocalStorage(character) {
        let chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        chars = chars.filter(c => c.name !== character.name);
        chars.push(character);
        localStorage.setItem('customCharacters', JSON.stringify(chars));
    }

    function generateAndSave() {
        const char = generateCharacter();
        if(!char) return;
        saveToLocalStorage(char);
        const previewDiv = document.getElementById('characterPreview');
        previewDiv.innerHTML = `
            <div class="preview-card">
                <div class="preview-avatar">${char.avatar}</div>
                <div class="preview-name">${char.name.toUpperCase()}</div>
                <div class="preview-talent">${char.talent}</div>
                <div class="preview-tag">${char.phrase}</div>
            </div>
            <div class="dossier">
                <div class="dossier-header"><h2>📁 ДОСЬЕ ПЕРСОНАЖА</h2></div>
                <div class="dossier-section"><h3>Основная информация</h3><p>Имя: ${char.name}<br>Талант: ${char.talent}<br>Роль: ${char.role}<br>Фраза: ${char.phrase}</p></div>
                <div class="dossier-section"><h3>Внешность</h3><p>${char.appearance}</p></div>
                <div class="dossier-section"><h3>Характер</h3><p>${char.personality}</p></div>
                <div class="dossier-section"><h3>История</h3><p>${char.backstory}</p></div>
                <div class="dossier-section"><h3>Отношения</h3><p>${char.relationships}</p></div>
                <div class="dossier-section"><h3>Навыки и слабости</h3><p>${char.skills}<br>Слабости: ${char.weaknesses}</p></div>
                <div class="dossier-section"><h3>Тайна</h3><p>${char.secret}</p></div>
                <div class="dossier-section"><h3>Судьба / Казнь</h3><p>${char.execName}<br>${char.execDesc}<br>Последние слова: ${char.lastWords}<br>Улика: ${char.evidence}</p></div>
                <div class="dossier-section"><h3>Диалоги</h3><p>${char.dialogues.map(d => d.replace(/\n/g, '<br>')).join('<br><br>')}</p></div>
                <div class="dossier-section"><h3>Free Time Events</h3><p>${char.freeTimeEvents.join('<br>')}</p></div>
                <div class="dossier-section"><h3>Улики</h3><p>${char.evidencesList.join('<br>')}</p></div>
                <div class="dossier-section"><h3>Саундтрек</h3><p>${char.soundtrack.join('<br>')}</p></div>
                <div class="dossier-section"><h3>Секретный файл</h3><p>${char.secretFile}</p></div>
                <div class="dossier-section"><h3>Финальный суд</h3><p>${char.finalTrial}</p></div>
            </div>
        `;
        const promptBox = document.getElementById('visualPromptBox');
        promptBox.innerHTML = `<h3>🎨 ПРОМПТ ДЛЯ ВИЗУАЛЬНОЙ КАРТОЧКИ</h3><div class="prompt-text">${char.visualPrompt.replace(/\n/g, '<br>')}</div><button id="copyPromptBtnInline" style="margin-top:15px; padding:10px; background:#1a3a1a;">📋 КОПИРОВАТЬ</button>`;
        document.getElementById('copyPromptBtnInline').onclick = () => { navigator.clipboard.writeText(char.visualPrompt); showToast('Промпт скопирован!'); };
        document.getElementById('resultArea').style.display = 'block';
        showToast(`✅ "${char.name}" добавлен в меню!`);
    }

    document.getElementById('generateBtn').onclick = generateAndSave;
    document.getElementById('goToMenuBtn').onclick = () => window.location.href = 'index.html';
    document.getElementById('generateAnotherBtn').onclick = () => {
        document.getElementById('resultArea').style.display = 'none';
        const ids = ['name','talent','food','hobby','look','secret','fear','secretHobby','alone','habit','subject'];
        ids.forEach(id => document.getElementById(id).value = '');
        document.getElementById('color').selectedIndex = 0;
        document.getElementById('strength').selectedIndex = 0;
        document.getElementById('speech').selectedIndex = 0;
        document.getElementById('monokuma').selectedIndex = 0;
        document.getElementById('time').selectedIndex = 0;
        document.getElementById('value').selectedIndex = 0;
        document.getElementById('moral').selectedIndex = 0;
        document.getElementById('roleGroup').selectedIndex = 0;
        document.getElementById('crime').selectedIndex = 0;
        showToast('Форма очищена');
    };
</script>
</body>
</html>
