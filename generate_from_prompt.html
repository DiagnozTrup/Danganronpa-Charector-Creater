<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Генерация персонажа | Danganronpa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .crt {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            background: #0a0a0a;
            border: 8px solid #3a2a2a;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        h1 {
            text-align: center;
            font-size: clamp(28px, 7vw, 38px);
            color: #ff8866;
            text-shadow: 0 0 6px #ff4422;
            margin-bottom: 15px;
        }
        .sub {
            text-align: center;
            color: #dd8888;
            font-size: 18px;
            margin-bottom: 30px;
            border-bottom: 2px solid #aa5544;
            padding-bottom: 15px;
        }
        .question {
            background: #111111cc;
            border-left: 6px solid #d45a2e;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        label {
            display: block;
            font-weight: bold;
            color: #ffccaa;
            margin-bottom: 12px;
            font-size: 18px;
        }
        input, select {
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #aa5544;
            color: #f0e0d0;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            border-radius: 16px;
        }
        button {
            background: #2a1a1a;
            border: 2px solid #aa6644;
            color: #ffccaa;
            padding: 14px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 60px;
            transition: all 0.2s;
            margin-top: 20px;
        }
        button:hover {
            background: #4a2a2a;
            box-shadow: 0 0 12px #ff8866;
        }
        .result-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #aa5544;
            display: none;
        }
        .preview-card {
            background: #1a1f1aee;
            border: 2px solid #ffaa66;
            border-radius: 28px;
            width: 260px;
            padding: 20px;
            margin: 0 auto;
            text-align: center;
        }
        .preview-avatar { font-size: 64px; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a4a2a;
            color: #cfeca8;
            padding: 12px 24px;
            border-radius: 40px;
            animation: fadeOut 3s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        .main-link {
            display: inline-block;
            background: #1a2a1a;
            color: #ccffaa;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            margin-bottom: 20px;
        }
        .main-link:hover {
            background: #2a4a2a;
            box-shadow: 0 0 8px #88ff88;
        }
        .success-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .success-buttons button { margin-top: 0; }
    </style>
</head>
<body>
<div class="crt">
    <a href="index.html" class="main-link">🏠 НА ГЛАВНУЮ</a>
    <h1>⚡ ГЕНЕРАЦИЯ ПЕРСОНАЖА ⚡</h1>
    <div class="sub">Ответь на вопросы – и мы создадим уникального персонажа!</div>

    <div class="question">
        <label>1. Твоё имя (или никнейм):</label>
        <input type="text" id="userName" placeholder="например: Иван Диогенов">
    </div>
    <div class="question">
        <label>2. Какой цвет тебе нравится больше всего?</label>
        <select id="color">
            <option value="red">Красный</option>
            <option value="black">Чёрный</option>
            <option value="green">Зелёный</option>
            <option value="blue">Синий</option>
            <option value="purple">Фиолетовый</option>
        </select>
    </div>
    <div class="question">
        <label>3. Выбери свой главный навык:</label>
        <select id="skill">
            <option value="hacker">Взлом и программирование</option>
            <option value="detective">Анализ и логика</option>
            <option value="fighter">Сила и боевые искусства</option>
            <option value="artist">Творчество и искусство</option>
            <option value="leader">Лидерство и харизма</option>
        </select>
    </div>
    <div class="question">
        <label>4. Как ты обычно разговариваешь?</label>
        <select id="speech">
            <option value="short">Коротко, по делу</option>
            <option value="long">Длинно, с монологами</option>
            <option value="pause">С паузами, загадочно</option>
        </select>
    </div>
    <div class="question">
        <label>5. Что ты делаешь в стрессовой ситуации?</label>
        <select id="stress">
            <option value="glasses">Поправляю несуществующие очки</option>
            <option value="silence">Молчу и анализирую</option>
            <option value="laugh">Нервно смеюсь</option>
        </select>
    </div>

    <button id="generateBtn">🎭 СОЗДАТЬ ПЕРСОНАЖА 🎭</button>

    <div id="resultArea" class="result-area">
        <div class="result-header" style="color:#88ff88; text-align:center; margin-bottom:15px;">✅ ПЕРСОНАЖ ГОТОВ!</div>
        <div id="characterPreview"></div>
        <div class="success-buttons">
            <button id="goToMenuBtn">🏠 ПЕРЕЙТИ В МЕНЮ</button>
            <button id="generateAnotherBtn">🔄 СОЗДАТЬ ЕЩЁ</button>
        </div>
    </div>
</div>

<script>
    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // Логика подбора таланта, фразы, внешности и т.д. на основе ответов
    function generateCharacter() {
        const userName = document.getElementById('userName').value.trim();
        if (!userName) {
            alert('Введите имя!');
            return null;
        }
        const color = document.getElementById('color').value;
        const skill = document.getElementById('skill').value;
        const speech = document.getElementById('speech').value;
        const stress = document.getElementById('stress').value;

        // Талант
        let talent = '';
        if (skill === 'hacker') talent = 'Сверхшкольный Взломщик Кода';
        else if (skill === 'detective') talent = 'Сверхшкольный Детектив';
        else if (skill === 'fighter') talent = 'Сверхшкольный Боец';
        else if (skill === 'artist') talent = 'Сверхшкольный Творец';
        else talent = 'Сверхшкольный Лидер';

        // Фирменная фраза
        let phrase = '';
        if (skill === 'hacker') phrase = '«Каждый баг – это дверь, которую нужно открыть.»';
        else if (skill === 'detective') phrase = '«Логика не врёт, врут только люди.»';
        else if (skill === 'fighter') phrase = '«Слабые умирают, сильные выживают.»';
        else if (skill === 'artist') phrase = '«Красота спасёт мир, даже этот.»';
        else phrase = '«Веди за собой, и они пойдут.»';

        // Внешность
        let appearance = '';
        if (color === 'red') appearance = 'Яркая красная одежда, дерзкий взгляд.';
        else if (color === 'black') appearance = 'Всё чёрное, скрытный стиль.';
        else if (color === 'green') appearance = 'Спокойный, природный образ.';
        else if (color === 'blue') appearance = 'Холодный и расчётливый вид.';
        else appearance = 'Загадочный фиолетовый акцент.';

        // Характер
        let personality = '';
        if (speech === 'short') personality = 'Говорит коротко, не терпит пустых слов.';
        else if (speech === 'long') personality = 'Обожает долгие монологи, любит поучать.';
        else personality = 'Загадочный, делает паузы для эффекта.';

        // Тайна (скрытая сторона)
        let secret = '';
        if (stress === 'glasses') secret = 'На самом деле он никогда не носил очки – это жест, чтобы скрыть нервозность.';
        else if (stress === 'silence') secret = 'В тишине он слышит голоса прошлого, которые направляют его.';
        else secret = 'Его смех – защитная реакция, внутри он боится собственной слабости.';

        // Улика
        let evidence = 'Странный лог в системе Monokuma, указывающий на нелегальное вмешательство.';
        // Название казни
        let execName = 'Цифровой Суд';
        // Описание казни
        let execDesc = 'Monokuma запускает виртуальную реальность, но персонаж взламывает код и выходит.';
        // Последние слова
        let lastWords = '«Я всегда знал, что это игра. Увидимся в следующем патче.»';

        const avatar = (color === 'red') ? '🔥' : (color === 'black') ? '🖤' : (color === 'green') ? '🍃' : (color === 'blue') ? '💧' : '🔮';

        return {
            name: userName,
            talent: talent,
            phrase: phrase,
            avatar: avatar,
            appearance: appearance,
            personality: personality,
            secret: secret,
            execName: execName,
            execDesc: execDesc,
            lastWords: lastWords,
            evidence: evidence
        };
    }

    function saveCharacter(character) {
        try {
            let chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
            chars = chars.filter(c => c.name !== character.name);
            chars.push(character);
            localStorage.setItem('customCharacters', JSON.stringify(chars));
            return true;
        } catch(e) {
            alert('Ошибка сохранения');
            return false;
        }
    }

    function generateAndSave() {
        const char = generateCharacter();
        if (!char) return;
        if (saveCharacter(char)) {
            let previewDiv = document.getElementById('characterPreview');
            previewDiv.innerHTML = `
                <div class="preview-card">
                    <div class="preview-avatar">${char.avatar}</div>
                    <div class="preview-name" style="font-size:20px; font-weight:bold;">${char.name.toUpperCase()}</div>
                    <div class="preview-talent" style="color:#ffcc88;">${char.talent}</div>
                    <div class="preview-tag" style="margin-top:10px;">${char.phrase}</div>
                </div>
                <div style="margin-top:15px; background:#1a1a1a; padding:15px; border-radius:16px;">
                    <strong>✨ Твой персонаж создан!</strong><br>
                    📛 Имя: ${char.name}<br>
                    🎭 Талант: ${char.talent}<br>
                    💬 Фраза: ${char.phrase}<br>
                    👁️ Внешность: ${char.appearance}<br>
                    ⚡ Характер: ${char.personality}<br>
                    🔮 Тайна: ${char.secret}<br>
                    💀 Казнь: ${char.execName}<br>
                    🔪 Улика: ${char.evidence}
                </div>
            `;
            document.getElementById('resultArea').style.display = 'block';
            showToast(`✅ Персонаж "${char.name}" добавлен в меню!`);
        } else {
            showToast('❌ Ошибка сохранения');
        }
    }

    document.getElementById('generateBtn').onclick = generateAndSave;
    document.getElementById('goToMenuBtn').onclick = () => window.location.href = 'index.html';
    document.getElementById('generateAnotherBtn').onclick = () => {
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('userName').value = '';
    };
</script>
</body>
</html>
