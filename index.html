    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', 'Courier', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "⚠ ⚠ ⚠";
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #aa444466;
            white-space: nowrap;
            animation: scroll 20s linear infinite;
            pointer-events: none;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .crt {
            position: relative;
            max-width: 1400px;
            width: 100%;
            background: #0b0e0a;
            border: 12px solid #3a2a2a;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 0 4px #1f1a0e, inset 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(1px);
        }
        .crt::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            border-radius: 20px;
        }
        .game-title {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #d44a2e;
            padding-bottom: 15px;
        }
        .game-title h1 {
            font-size: clamp(28px, 7vw, 42px);
            letter-spacing: 4px;
            color: #ffe6cc;
            text-shadow: 0 0 8px #ff6644, 4px 4px 0 #3a1a1a;
            font-weight: bold;
        }
        .game-title p {
            font-size: clamp(14px, 4vw, 18px);
            color: #ffaa88;
            margin-top: 8px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #3a1a1a;
        }
        .section-label {
            font-size: clamp(18px, 5vw, 24px);
            color: #ffcc88;
            text-align: center;
            margin-bottom: 25px;
            background: #2a1a1acc;
            display: inline-block;
            padding: 8px 28px;
            border-radius: 40px;
            margin-left: auto;
            margin-right: auto;
            font-weight: bold;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px #ff664422;
        }
        .characters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
            margin: 30px 0;
        }
        .character-card {
            background: #1a1f1aee;
            backdrop-filter: blur(4px);
            border: 2px solid #aa6644;
            border-radius: 28px;
            width: min(240px, 85vw);
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .character-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,100,80,0.2), transparent);
            transition: left 0.5s;
        }
        .character-card:hover::after {
            left: 100%;
        }
        .character-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #ffaa66;
            box-shadow: 0 0 25px #ffaa6688;
        }
        .character-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #1e2a1a;
            border: 3px solid #ffaa66;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            transition: transform 0.2s;
        }
        .character-card:hover .character-avatar {
            transform: scale(1.05);
        }
        .character-name {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: bold;
            color: #ffeebb;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #2a1a1a;
        }
        .character-title {
            font-size: 13px;
            color: #ddbb88;
            margin-top: 5px;
            font-weight: bold;
        }
        .character-tag {
            font-size: 11px;
            background: #000000aa;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 30px;
            color: #ffcc88;
            margin-top: 10px;

    function initAudio() {
        if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
    }
    function playSound() {
        initAudio();
        if (!audioCtx) return;
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.start();
        osc.stop(now + 0.1);
    }

            '<body><div class="crt"><div class="case-file"><div class="monokuma-header"><h1>⚡ ФАЙЛ MONOKUMA ⚡</h1><p>🔒 ' + name + ' • ЗАКРЫТЫЙ ДОСТУП 🔒</p></div>' +

        grid.innerHTML = '';
        var standard = [
            { name: 'ИВАН ДИОГЕНОВ', talent: 'Бета-тестер', tag: '#root', avatar: '⚡', file: 'ivan_profile_sound.html' },
            { name: 'КАЗУИЧИ СОДА', talent: 'Механик', tag: '#repair', avatar: '🔧', file: 'ivan_profile_sound.html' },
            { name: 'ТИАКИ НАМИКАМИ', talent: 'Геймер', tag: '#1CC', avatar: '🎮', file: 'ivan_profile_sound.html' },
            { name: '✨ НОВЫЙ ПЕРСОНАЖ', talent: 'Создать через вопросы', tag: '#генератор', avatar: '✨', url: 'generate_from_prompt.html', isLink: true }
        ];
        for (var i = 0; i < standard.length; i++) {
            var c = standard[i];
            var card = document.createElement('div');
            card.className = 'character-card';
            if (c.isLink) card.style.background = '#2a1a2aee';
            card.innerHTML = '<div class="character-avatar">' + c.avatar + '</div><div class="character-name">' + c.name + '</div><div class="character-title">' + c.talent + '</div><div class="character-tag">' + c.tag + '</div>';
            if (c.isLink) {
                card.addEventListener('click', (function(url) { return function() { playSound(); setTimeout(function(){ window.location.href = url; }, 100); }; })(c.url));
            } else {
                card.addEventListener('click', (function(file) { return function() { playSound(); setTimeout(function(){ window.location.href = file; }, 100); }; })(c.file));
            }
            grid.appendChild(card);
        }
        var custom = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        for (var j = 0; j < custom.length; j++) {
            var ch = custom[j];
            var card = document.createElement('div');
            card.className = 'character-card';
            card.style.background = '#1a2a2aee';
            card.style.borderColor = '#aa88aa';
            var shortPhrase = (ch.phrase || '').substring(0, 35);
            card.innerHTML = '<div class="character-avatar">' + (ch.avatar || '⭐') + '</div><div class="character-name">' + (ch.name || '').toUpperCase() + '</div><div class="character-title">' + (ch.talent || '') + '</div><div class="character-tag">' + shortPhrase + '...</div>';
            card.addEventListener('click', (function(charData) {
                return function() {
                    playSound();
                    var full = {
                        name: charData.name,
                        talent: charData.talent,
                        phrase: charData.phrase,
                        avatar: charData.avatar,
                        appearance: charData.appearance || 'Не указана',
                        personality: charData.personality || 'Загадочный',
                        secret: charData.secret || 'Хранит тайну',
                        execName: charData.execName || 'Судьбоносная казнь',
                        execDesc: charData.execDesc || 'Описание казни',
                        lastWords: charData.lastWords || '«...»',
                        evidence: charData.evidence || 'Неизвестная улика',
                        backstory: charData.backstory || 'История не известна',
                        relationships: charData.relationships || 'Отношения не определены',
                        skills: charData.skills || 'Неизвестно',
                        weaknesses: charData.weaknesses || 'Неизвестно',
                        facts: charData.facts || 'Нет информации'
                    };
                    var html = buildProfileHTML(full);
                    var blob = new Blob([html], { type: 'text/html' });
                    var url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
                };
            })(ch));
            grid.appendChild(card);
        }
    }

    // Обработчики кнопок
    document.getElementById('refreshBtn').onclick = function() { loadMenu(); playSound(); };
    document.getElementById('clearAllBtn').onclick = function() {
        if (confirm('Удалить всех кастомных персонажей?')) {
            localStorage.removeItem('customCharacters');
            loadMenu();
            alert('✅ Все удалены');
        }
    };
    document.getElementById('exportAllBtn').onclick = function() {
        var chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        var blob = new Blob([JSON.stringify(chars, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.download = 'backup_' + Date.now() + '.json';
        a.href = URL.createObjectURL(blob);
        a.click();
        URL.revokeObjectURL(a.href);
    };
    var importFile = document.getElementById('importFileInput');
    document.getElementById('importBtn').onclick = function() { importFile.click(); };
    importFile.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            try {
                var imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    var current = JSON.parse(localStorage.getItem('customCharacters') || '[]');
                    var added = 0;
                    for (var i = 0; i < imported.length; i++) {
                        var exists = false;
                        for (var j = 0; j < current.length; j++) {
                            if (current[j].name === imported[i].name) { exists = true; break; }
                        }
                        if (!exists) {
                            current.push(imported[i]);
                            added++;
                        }
                    }
                    localStorage.setItem('customCharacters', JSON.stringify(current));
                    loadMenu();
                    alert('✅ Импортировано ' + added + ' персонажей');
                } else alert('Не массив');
            } catch(err) { alert('Ошибка файла'); }
            importFile.value = '';
        };
        reader.readAsText(file);
    };
    document.body.addEventListener('click', function() { initAudio(); }, { once: true });
    loadMenu();
</script>
    <!-- Фоновая музыка (автовоспроизведение может быть заблокировано браузером, добавлена кнопка) -->
<audio id="bgMusic" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>
<div style="position: fixed; bottom: 20px; left: 20px; z-index: 999;">
    <button id="musicToggle" style="background: #2a1a1a; border: 2px solid #aa6644; color: #ffccaa; padding: 8px 16px; border-radius: 40px; cursor: pointer; font-family: monospace;">🔊 Музыка вкл</button>
</div>
<script>
    const music = document.getElementById('bgMusic');
    const toggleBtn = document.getElementById('musicToggle');
    let musicPlaying = false;
    // Попытка автовоспроизведения (может не сработать)
    music.play().then(() => { musicPlaying = true; toggleBtn.textContent = '🔇 Музыка выкл'; }).catch(() => {});
    toggleBtn.addEventListener('click', () => {
        if (musicPlaying) {
            music.pause();
            toggleBtn.textContent = '🔊 Музыка вкл';
        } else {
            music.play();
            toggleBtn.textContent = '🔇 Музыка выкл';
        }
        musicPlaying = !musicPlaying;
    });
</script>
</body>
</html>
