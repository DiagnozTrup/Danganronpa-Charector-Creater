<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Danganronpa 2: Выбор персонажа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', 'Courier', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Эффект монитора */
        .crt {
            position: relative;
            max-width: 1400px;
            width: 100%;
            background: #0b0e0a;
            border: 12px solid #3a2a2a;
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .crt::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            border-radius: 24px;
        }

        .game-title {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #d44a2e;
            padding-bottom: 15px;
        }

        .game-title h1 {
            font-size: clamp(28px, 7vw, 42px);
            color: #ffe6cc;
            text-shadow: 0 0 8px #ff6644, 3px 3px 0 #3a1a1a;
        }

        .game-title p {
            font-size: 16px;
            color: #ffaa88;
            margin-top: 8px;
        }

        .section-label {
            font-size: 22px;
            color: #ffcc88;
            text-align: center;
            margin-bottom: 25px;
            background: #2a1a1acc;
            display: block;
            width: fit-content;
            padding: 8px 28px;
            border-radius: 40px;
            margin-left: auto;
            margin-right: auto;
            font-weight: bold;
        }

        .characters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }

        .character-card {
            background: #1a1f1aee;
            backdrop-filter: blur(4px);
            border: 2px solid #aa6644;
            border-radius: 28px;
            width: 220px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .character-card:hover {
            transform: translateY(-8px);
            border-color: #ffaa66;
            box-shadow: 0 0 20px #ffaa6688;
        }

        .character-avatar {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .character-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffeebb;
        }

        .character-title {
            font-size: 12px;
            color: #ddbb88;
            margin-top: 5px;
        }

        .character-tag {
            font-size: 10px;
            background: #000000aa;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            color: #ffcc88;
            margin-top: 10px;
        }

        .admin-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .admin-btn {
            background: #2a1a1a;
            border: 1px solid #aa6644;
            color: #ffccaa;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .admin-btn:hover {
            background: #4a2a2a;
            color: #fff;
            box-shadow: 0 0 8px #ff8866;
        }

        .monokuma-note {
            font-size: 14px;
            color: #ccaa88;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #5a3a2a;
            padding-top: 20px;
        }

        /* Секретное поле и кнопка */
        .secret-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 1000;
        }

        .secret-field {
            width: 50px;
            height: 30px;
            background: #1a1a1a;
            border: 1px solid #aa6644;
            color: #ffccaa;
            font-family: monospace;
            font-size: 10px;
            text-align: center;
            border-radius: 8px;
            opacity: 0.2;
            transition: opacity 0.3s;
        }

        .secret-field:hover,
        .secret-field:focus {
            opacity: 1;
            outline: none;
        }

        .secret-monokuma-btn {
            width: 30px;
            height: 30px;
            background: #1a1a1a;
            border: 1px solid #aa6644;
            color: #ffccaa;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            opacity: 0.2;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .secret-monokuma-btn:hover {
            opacity: 0.8;
            background: #4a2a2a;
        }

        .heart-popup {
            position: fixed;
            bottom: 70px;
            right: 30px;
            background: #ff3366;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 60px;
            box-shadow: 0 0 20px #ff3366;
            z-index: 1001;
            animation: fadeHeart 3s forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes fadeHeart {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            40% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: translateY(-30px) scale(0.8); visibility: hidden; }
        }
    </style>
</head>
<body>
<div class="crt">
    <div class="game-title">
        <h1>⚡ АКАДЕМИЯ НАДЕЖДЫ ⚡</h1>
        <p>ОСТРОВ ДЖАББЕРВОК • РЕЖИМ ВЫБОРА ЦЕЛИ</p>
    </div>
    <div class="section-label">🎮 ВЫБОР ПЕРСОНАЖА / ULTIMATE FILES 🎮</div>
    <div class="characters-grid" id="charactersGrid"></div>
    <div class="admin-buttons">
        <button id="refreshBtn" class="admin-btn">🔄 ОБНОВИТЬ МЕНЮ</button>
        <button id="exportAllBtn" class="admin-btn">📤 ЭКСПОРТ ВСЕХ</button>
        <button id="importBtn" class="admin-btn">📥 ИМПОРТ</button>
        <button id="clearAllBtn" class="admin-btn" style="background:#2a1a1a;">🗑️ ОЧИСТИТЬ</button>
    </div>
    <div class="monokuma-note">🎮🐻 MONOKUMA: «Пупупу... выбери цель для испытания. Создай своего персонажа через генератор!» 🐻🎮</div>
</div>
<input type="file" id="importFileInput" style="display:none" accept=".json">

<div class="secret-panel">
    <input type="text" id="secretEasterEgg" class="secret-field" placeholder="?">
    <button id="secretMonokumaBtn" class="secret-monokuma-btn" title="Секрет Monokuma">🐻</button>
</div>

<script>
    // Звук
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)(); }
    function playSound() {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.start();
        osc.stop(now + 0.1);
    }

    // Экранирование
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Простая функция генерации профиля (без сложностей, чтобы не ломать страницу)
    function buildProfileHTML(char) {
        return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>${escapeHtml(char.name)}</title>
<style>body{background:#1a0000;font-family:'Courier New',monospace;padding:20px;}.crt{max-width:800px;margin:auto;background:#0a0a0a;border:8px solid #3a1a1a;padding:20px;color:#e0e0e0;}h1{color:#ff8888;}button{background:#2a0a0a;border:1px solid #aa4444;color:#ffaaaa;padding:10px;width:100%;margin-top:20px;cursor:pointer;}</style>
<body><div class="crt"><h1>${escapeHtml(char.name)}</h1><p><strong>Талант:</strong> ${escapeHtml(char.talent)}</p><p><strong>Роль:</strong> ${escapeHtml(char.role)}</p><p><strong>Фраза:</strong> ${escapeHtml(char.phrase)}</p><button onclick="window.close()">Закрыть</button></div></body></html>`;
    }

    // Загрузка меню
    function loadMenu() {
        const grid = document.getElementById('charactersGrid');
        grid.innerHTML = '';

        const standard = [
            { name: 'ИВАН ДИОГЕНОВ', talent: 'Бета-тестер', tag: '#root', avatar: '⚡', file: 'ivan_profile_sound.html' },
            { name: 'КАЗУИЧИ СОДА', talent: 'Механик', tag: '#repair', avatar: '🔧', file: 'ivan_profile_sound.html' },
            { name: 'ТИАКИ НАМИКАМИ', talent: 'Геймер', tag: '#1CC', avatar: '🎮', file: 'ivan_profile_sound.html' },
            { name: '✨ НОВЫЙ ПЕРСОНАЖ', talent: 'Создать через вопросы', tag: '#генератор', avatar: '✨', url: 'generate_from_prompt.html', isLink: true }
        ];

        standard.forEach(c => {
            const card = document.createElement('div');
            card.className = 'character-card';
            if (c.isLink) card.style.background = '#2a1a2aee';
            card.innerHTML = `<div class="character-avatar">${c.avatar}</div>
                              <div class="character-name">${c.name}</div>
                              <div class="character-title">${c.talent}</div>
                              <div class="character-tag">${c.tag}</div>`;
            if (c.isLink) {
                card.addEventListener('click', () => { playSound(); setTimeout(() => location.href = c.url, 100); });
            } else {
                card.addEventListener('click', () => { playSound(); setTimeout(() => location.href = c.file, 100); });
            }
            grid.appendChild(card);
        });

        const custom = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        custom.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'character-card';
            card.style.background = '#1a2a2aee';
            card.style.borderColor = '#aa88aa';
            card.innerHTML = `<div class="character-avatar">${ch.avatar || '⭐'}</div>
                              <div class="character-name">${ch.name.toUpperCase()}</div>
                              <div class="character-title">${ch.talent}</div>
                              <div class="character-tag">${(ch.phrase || '').substring(0, 30)}...</div>`;
            card.addEventListener('click', () => {
                playSound();
                const full = {
                    name: ch.name,
                    talent: ch.talent,
                    phrase: ch.phrase,
                    role: ch.role,
                    avatar: ch.avatar
                };
                const html = buildProfileHTML(full);
                const blob = new Blob([html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            });
            grid.appendChild(card);
        });
    }

    // Обработчики кнопок
    document.getElementById('refreshBtn').onclick = () => { loadMenu(); playSound(); };
    document.getElementById('clearAllBtn').onclick = () => {
        if (confirm('Удалить всех кастомных персонажей?')) {
            localStorage.removeItem('customCharacters');
            loadMenu();
            alert('✅ Все удалены');
        }
    };
    document.getElementById('exportAllBtn').onclick = () => {
        const chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        const blob = new Blob([JSON.stringify(chars, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.download = `backup_${Date.now()}.json`;
        a.href = URL.createObjectURL(blob);
        a.click();
        URL.revokeObjectURL(a.href);
    };
    const importFile = document.getElementById('importFileInput');
    document.getElementById('importBtn').onclick = () => importFile.click();
    importFile.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    let current = JSON.parse(localStorage.getItem('customCharacters') || '[]');
                    let added = 0;
                    imported.forEach(c => {
                        if (!current.some(ex => ex.name === c.name)) {
                            current.push(c);
                            added++;
                        }
                    });
                    localStorage.setItem('customCharacters', JSON.stringify(current));
                    loadMenu();
                    alert(`✅ Импортировано ${added} персонажей`);
                } else alert('Не массив');
            } catch(err) { alert('Ошибка файла'); }
            importFile.value = '';
        };
        reader.readAsText(file);
    };

    // Пасхалки
    const secretInput = document.getElementById('secretEasterEgg');
    const secretBtn = document.getElementById('secretMonokumaBtn');
    secretBtn.addEventListener('click', () => {
        window.open('monokuma_secret.html', '_blank');
    });

    function showHeart(text) {
        const heart = document.createElement('div');
        heart.className = 'heart-popup';
        heart.innerHTML = text;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
    }

    secretInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = secretInput.value.trim().toLowerCase();
            if (val === 'ты умница') {
                showHeart('❤️ СПАСИБО ❤️');
                secretInput.value = '';
            } else if (val === '11037') {
                showHeart('❓ ОТКУДА... ❤️');
                setTimeout(() => {
                    const thanksHTML = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Спасибо, игрок</title>
<style>body{background:#0a0a0a;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;animation:glitch 0.3s infinite;}@keyframes glitch{0%{background:#0a0a0a}30%{background:#1a0000}70%{background:#00001a}100%{background:#0a0a0a}}.container{text-align:center;background:#000000aa;backdrop-filter:blur(8px);padding:40px;border-radius:30px;border:2px solid #ff3366;animation:textGlitch 0.5s infinite;}@keyframes textGlitch{0%{text-shadow:-2px 0 red,2px 0 blue}50%{text-shadow:2px 0 red,-2px 0 blue}100%{text-shadow:-2px 0 blue,2px 0 red}}h1{color:#ff8888;font-size:42px;}.message{color:#ffddbb;font-size:20px;}button{margin-top:20px;background:#2a1a1a;border:2px solid #ff6644;color:#ffccaa;padding:12px 24px;cursor:pointer;border-radius:40px;}</style>
</head><body><div class="container"><h1>СПАСИБО, ИГРОК!</h1><div class="message">Ты нашёл тайное послание Monokuma.<br>Ты настоящий Бета-тестер Реальности.<br>Пупупу... Продолжай в том же духе.</div><button onclick="window.close()">ЗАКРЫТЬ</button></div></body></html>`;
                    const blob = new Blob([thanksHTML], { type: 'text/html' });
                    window.open(URL.createObjectURL(blob), '_blank');
                }, 3000);
                secretInput.value = '';
            }
        }
    });

    document.body.addEventListener('click', () => initAudio(), { once: true });
    loadMenu();
</script>
</body>
</html>
