<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Выбор персонажа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', 'Courier', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "⚠ ⚠ ⚠";
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #aa444466;
            white-space: nowrap;
            animation: scroll 20s linear infinite;
            pointer-events: none;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .crt {
            position: relative;
            max-width: 1400px;
            width: 100%;
            background: #0b0e0a;
            border: 12px solid #3a2a2a;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 0 4px #1f1a0e, inset 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(1px);
        }
        .crt::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            border-radius: 20px;
        }
        .game-title {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #d44a2e;
            padding-bottom: 15px;
        }
        .game-title h1 {
            font-size: clamp(28px, 7vw, 42px);
            letter-spacing: 4px;
            color: #ffe6cc;
            text-shadow: 0 0 8px #ff6644, 4px 4px 0 #3a1a1a;
            font-weight: bold;
        }
        .game-title p {
            font-size: clamp(14px, 4vw, 18px);
            color: #ffaa88;
            margin-top: 8px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #3a1a1a;
        }
        .section-label {
            font-size: clamp(18px, 5vw, 24px);
            color: #ffcc88;
            text-align: center;
            margin-bottom: 25px;
            background: #2a1a1acc;
            display: block;
            padding: 8px 28px;
            border-radius: 40px;
            margin-left: auto;
            margin-right: auto;
            font-weight: bold;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px #ff664422;
            width: fit-content;
        }
        .characters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
            margin: 30px 0;
        }
        .character-card {
            background: #1a1f1aee;
            backdrop-filter: blur(4px);
            border: 2px solid #aa6644;
            border-radius: 28px;
            width: min(240px, 85vw);
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .character-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,100,80,0.2), transparent);
            transition: left 0.5s;
        }
        .character-card:hover::after {
            left: 100%;
        }
        .character-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #ffaa66;
            box-shadow: 0 0 25px #ffaa6688;
        }
        .character-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #1e2a1a;
            border: 3px solid #ffaa66;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            transition: transform 0.2s;
        }
        .character-card:hover .character-avatar {
            transform: scale(1.05);
        }
        .character-name {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: bold;
            color: #ffeebb;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #2a1a1a;
        }
        .character-title {
            font-size: 13px;
            color: #ddbb88;
            margin-top: 5px;
            font-weight: bold;
        }
        .character-tag {
            font-size: 11px;
            background: #000000aa;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 30px;
            color: #ffcc88;
            margin-top: 10px;
        }
        .admin-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .admin-btn {
            background: #2a1a1a;
            border: 1px solid #aa6644;
            color: #ffccaa;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .admin-btn:hover {
            background: #4a2a2a;
            color: #fff;
            box-shadow: 0 0 8px #ff8866;
        }
        .monokuma-note {
            font-size: 14px;
            color: #ccaa88;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #5a3a2a;
            padding-top: 20px;
            font-weight: bold;
        }
        @media (max-width: 760px) {
            .character-card { width: 180px; padding: 15px 10px; }
            .character-avatar { width: 70px; height: 70px; font-size: 40px; }
            .character-name { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="crt">
    <div class="game-title"><h1>⚡ АКАДЕМИЯ НАДЕЖДЫ ⚡</h1><p>ОСТРОВ ДЖАББЕРВОК • РЕЖИМ ВЫБОРА ЦЕЛИ</p></div>
    <div class="section-label">🎮 ВЫБОР ПЕРСОНАЖА / ULTIMATE FILES 🎮</div>
    <div class="characters-grid" id="charactersGrid"></div>
    <div class="admin-buttons">
        <button id="refreshBtn" class="admin-btn">🔄 ОБНОВИТЬ МЕНЮ</button>
        <button id="exportAllBtn" class="admin-btn">📤 ЭКСПОРТ ВСЕХ</button>
        <button id="importBtn" class="admin-btn">📥 ИМПОРТ</button>
        <button id="clearAllBtn" class="admin-btn" style="background:#2a1a1a;">🗑️ ОЧИСТИТЬ</button>
    </div>
    <div class="monokuma-note">🐻 MONOKUMA: «Пупупу... выбери цель для испытания. Создай своего персонажа через генератор!»</div>
</div>
<input type="file" id="importFileInput" style="display:none" accept=".json">

<script>
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)(); }
    function playSound() {
        initAudio();
        if (!audioCtx) return;
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.start();
        osc.stop(now + 0.1);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function buildProfileHTML(char) {
        var name = escapeHtml(char.name);
        var talent = escapeHtml(char.talent);
        var phrase = escapeHtml(char.phrase);
        var avatar = char.avatar || '⭐';
        var role = escapeHtml(char.role || 'Не определена');
        var appearance = escapeHtml(char.appearance || 'Не указана');
        var personality = escapeHtml(char.personality || 'Загадочный');
        var secret = escapeHtml(char.secret || 'Хранит тайну');
        var execName = escapeHtml(char.execName || 'Судьбоносная казнь');
        var execDesc = escapeHtml(char.execDesc || 'Описание казни');
        var lastWords = escapeHtml(char.lastWords || '«...»');
        var evidence = escapeHtml(char.evidence || 'Неизвестная улика');
        var backstory = escapeHtml(char.backstory || 'Неизвестна');
        var relationships = escapeHtml(char.relationships || 'Не определены');
        var skills = escapeHtml(char.skills || 'Неизвестно');
        var weaknesses = escapeHtml(char.weaknesses || 'Неизвестно');
        var dialogues = char.dialogues || [];
        var freeTimeEvents = char.freeTimeEvents || [];
        var evidencesList = char.evidencesList || [];
        var soundtrack = char.soundtrack || [];
        var secretFile = escapeHtml(char.secretFile || 'Нет файла');
        var finalTrial = escapeHtml(char.finalTrial || 'Не описан');
        var visualPrompt = char.visualPrompt || 'Промпт не указан';

        var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + name + '</title><style>' +
            '*{margin:0;padding:0;box-sizing:border-box;}body{background:linear-gradient(135deg,#1a0000,#2d0000);font-family:"Courier New",monospace;padding:15px 12px;min-height:100vh;}' +
            '.crt{max-width:1000px;width:100%;margin:0 auto;background:#0a0a0a;border:8px solid #3a1a1a;border-radius:8px;position:relative;}' +
            '.crt::before{content:" ";display:block;position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(0,255,0,0.03) 0px,rgba(0,255,0,0.03) 2px,transparent 2px,transparent 4px);pointer-events:none;border-radius:6px;}' +
            '.case-file{padding:20px 18px;color:#e0e0e0;border:1px solid #5a2a2a;background:#0d0d0d;position:relative;z-index:1;}' +
            '.monokuma-header{text-align:center;border-bottom:3px solid #d42e2e;margin-bottom:20px;padding-bottom:12px;}' +
            '.monokuma-header h1{font-size:clamp(28px,7vw,36px);letter-spacing:3px;color:#ffffff;text-shadow:3px 3px 0 #5a0000;}' +
            '.monokuma-header p{font-size:14px;color:#ff8888;margin-top:8px;font-weight:bold;}' +
            '.warning{background:#1a0505;border-left:8px solid #ff0000;padding:12px;margin-bottom:20px;font-weight:bold;color:#ffaaaa;font-size:13px;text-transform:uppercase;}' +
            '.tabs-wrapper{overflow-x:auto;overflow-y:hidden;margin-bottom:20px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#aa4444 #1a0a0a;}' +
            '.tabs-wrapper::-webkit-scrollbar{height:8px;}' +
            '.tabs-wrapper::-webkit-scrollbar-track{background:#1a0a0a;border-radius:4px;border:1px solid #5a2a2a;}' +
            '.tabs-wrapper::-webkit-scrollbar-thumb{background:#aa4444;border-radius:4px;}' +
            '.tabs{display:flex;flex-wrap:nowrap;gap:6px;padding-bottom:5px;min-width:min-content;}' +
            '.tab-btn{background:#1a0a0a;border:none;color:#cc9999;font-family:"Courier New",monospace;font-size:14px;font-weight:bold;padding:12px 16px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;transition:0.2s;}' +
            '.tab-btn:hover{background:#2a1515;color:#ffaaaa;}' +
            '.tab-btn.active{background:#2a0a0a;color:#ff7777;border-bottom:2px solid #ff4444;}' +
            '.tab-content{display:none;animation:fadeIn 0.25s ease;max-height:55vh;overflow-y:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:#aa4444 #1a0a0a;}' +
            '.tab-content::-webkit-scrollbar{width:8px;}' +
            '.tab-content::-webkit-scrollbar-track{background:#1a0a0a;border-radius:4px;border:1px solid #5a2a2a;}' +
            '.tab-content::-webkit-scrollbar-thumb{background:#aa4444;border-radius:4px;}' +
            '.tab-content::-webkit-scrollbar-thumb:hover{background:#ff6666;}' +
            '.tab-content.active{display:block;}' +
            '@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}' +
            '.id-card{background:#111111;border:2px solid #333;padding:18px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:15px;}' +
            '.id-avatar{background:#1a1a1a;width:80px;height:80px;border:2px solid #d42e2e;display:flex;align-items:center;justify-content:center;font-size:36px;color:#ff8888;flex-shrink:0;}' +
            '.id-stats{flex:1;min-width:160px;}' +
            '.id-stats p{margin:8px 0;font-size:15px;line-height:1.5;}' +
            '.stat-label{color:#ffaaaa;font-weight:bold;}' +
            '.quote{background:#181010;border-left:6px solid #ff4444;padding:14px;margin:15px 0;font-style:italic;font-size:15px;color:#ffddaa;font-weight:bold;}' +
            '.sprite-pose,.evidence-card,.gallery-item,.track-item,.dialogue-scene{background:#0a0f0a;border:1px dashed #3a6a3a;padding:12px;margin:10px 0;font-size:14px;border-radius:6px;}' +
            '.execution{background:#1a0000;border:2px solid #aa2222;padding:16px;margin:15px 0;color:#ffaaaa;font-size:15px;border-radius:8px;}' +
            '.bracelet{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:8px;vertical-align:middle;}' +
            '.bracelet.green{background:#00ff00;animation:pulseGreen 1s infinite;box-shadow:0 0 5px #00ff00;}' +
            '.bracelet.red{background:#ff0000;animation:pulseRed 0.3s infinite;box-shadow:0 0 5px #ff0000;}' +
            '.bracelet.yellow{background:#ffff00;animation:pulseYellow 0.5s infinite;box-shadow:0 0 5px #ffff00;}' +
            '@keyframes pulseGreen{0%{opacity:0.6;transform:scale(0.9);}100%{opacity:1;transform:scale(1.1);}}' +
            '@keyframes pulseRed{0%{opacity:0.5;transform:scale(0.8);}100%{opacity:1;transform:scale(1.2);}}' +
            '@keyframes pulseYellow{0%{opacity:0.6;transform:scale(0.9);}100%{opacity:1;transform:scale(1.1);}}' +
            'button:not(.tab-btn){background:#2a0a0a;color:#ffcccc;border:1px solid #aa4444;padding:14px;margin-top:18px;font-size:16px;width:100%;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.2s;}' +
            'button:not(.tab-btn):hover{background:#4a1a1a;border-color:#ff8888;color:white;}' +
            'footer{text-align:center;font-size:12px;margin-top:20px;color:#886666;}' +
            '@media (max-width:600px){.case-file{padding:15px;}.tab-btn{padding:10px 12px;font-size:12px;}.id-avatar{width:60px;height:60px;font-size:28px;}.id-stats p{font-size:13px;}.tab-content{max-height:50vh;}}' +
            '</style></head><body><div class="crt"><div class="case-file">' +
            '<div class="monokuma-header"><h1>⚡ ФАЙЛ MONOKUMA ⚡</h1><p>🔒 ' + name + ' • ЗАКРЫТЫЙ ДОСТУП 🔒</p></div>' +
            '<div class="warning">⚠️ СТРОГО КОНФИДЕНЦИАЛЬНО. РАЗГЛАШЕНИЕ КАРАЕТСЯ КАЗНЬЮ. ⚠️</div>' +
            '<div class="tabs-wrapper"><div class="tabs">' +
            '<button class="tab-btn active" data-tab="tab1">📁 Личное дело</button>' +
            '<button class="tab-btn" data-tab="tab2">🎭 Диалоги</button>' +
            '<button class="tab-btn" data-tab="tab3">💀 Казнь</button>' +
            '<button class="tab-btn" data-tab="tab4">🔍 Улики</button>' +
            '<button class="tab-btn" data-tab="tab5">🖼️ Галерея</button>' +
            '<button class="tab-btn" data-tab="tab6">🎵 Саундтрек</button>' +
            '<button class="tab-btn" data-tab="tab7">📜 Секретный файл</button>' +
            '<button class="tab-btn" data-tab="tab8">⚖️ Финальный суд</button>' +
            '</div></div>' +
            '<div id="tab1" class="tab-content active"><div class="id-card"><div class="id-avatar">' + avatar + '</div><div class="id-stats"><p><span class="stat-label">Имя:</span> ' + name + ' <span class="bracelet green" id="braceletIndicator"></span></p><p><span class="stat-label">Талант:</span> <strong style="color:#ff8888;">' + talent + '</strong></p><p><span class="stat-label">Роль:</span> ' + role + '</p><p><span class="stat-label">Фраза:</span> ' + phrase + '</p><p><span class="stat-label">Статус:</span> Активен. Разыскивается Monokuma.</p></div></div><div class="quote">' + phrase + '</div><h3>📖 FREE TIME EVENTS</h3>' + freeTimeEvents.map(ev => '<div class="sprite-pose">✨ ' + escapeHtml(ev) + '</div>').join('') + '<div class="warning">⚡ КОММЕНТАРИЙ MONOKUMA: ' + secret + '</div></div>' +
            '<div id="tab2" class="tab-content">' + dialogues.map(d => '<div class="dialogue-scene"><span class="dialogue-name">' + escapeHtml(d.split('\n')[0]) + '</span><br>' + escapeHtml(d.substring(d.indexOf('\n')+1)) + '</div>').join('') + '</div>' +
            '<div id="tab3" class="tab-content"><div class="execution"><strong>💀 КАЗНЬ: ' + execName + '</strong><br>' + execDesc + '</div><div class="quote"><strong>ФРАЗА ПЕРЕД КАЗНЬЮ:</strong><br>' + lastWords + '</div></div>' +
            '<div id="tab4" class="tab-content">' + evidencesList.map(e => '<div class="evidence-card"><strong>🔍 ' + escapeHtml(e) + '</strong></div>').join('') + '</div>' +
            '<div id="tab5" class="tab-content">' +
            '<div class="gallery-item"><strong>🖼️ Нейтральный спрайт</strong><br>Спокойная поза, рука у подбородка.</div>' +
            '<div class="gallery-item"><strong>🖼️ Эмоциональный спрайт</strong><br>Наклон вперёд.</div>' +
            '<div class="gallery-item"><strong>🖼️ Угрожающий спрайт</strong><br>Чёлка закрывает глаза. Браслет КРАСНЫЙ.</div>' +
            '<div class="gallery-item"><strong>🖼️ Повреждённый спрайт</strong><br>Спрайт распадается на пиксели.</div>' +
            '<div class="gallery-item"><strong>🎨 ПРОМПТ ДЛЯ ВИЗУАЛИЗАЦИИ</strong><br>' +
            '<div class="prompt-text" style="background:#1a1a1a; padding:10px; border-radius:12px; font-family:monospace; white-space:pre-wrap; border-left:3px solid #ffaa66;">' + escapeHtml(visualPrompt) + '</div>' +
            '<button class="copy-prompt-btn" style="margin-top:10px; background:#1a3a1a; border:1px solid #66aa66; color:#ffccaa; padding:6px 12px; border-radius:30px; cursor:pointer; font-weight:bold;">📋 КОПИРОВАТЬ ПРОМПТ</button>' +
            '</div></div>' +
            '<div id="tab6" class="tab-content">' + soundtrack.map(t => '<div class="track-item">🎵 ' + escapeHtml(t) + '</div>').join('') + '</div>' +
            '<div id="tab7" class="tab-content"><div class="warning" style="border-left-color:#ff00ff;">⚡ ЭТОТ ФАЙЛ НЕ ДОЛЖЕН СУЩЕСТВОВАТЬ</div><div class="execution" style="background:#110022;border-color:#ff44ff;">' + secretFile + '</div><div class="quote"><strong>🔐 КОД АКТИВАЦИИ БРАСЛЕТА:</strong><br><code>>_ root.access.granted<br>>_ ' + name.replace(/\s/g, '_') + '/промпт_уровень_0</code></div></div>' +
            '<div id="tab8" class="tab-content"><div class="execution" style="background:#1a0000;border-color:#ff4444;"><strong>⚖️ ФИНАЛЬНЫЙ СУД</strong><br>' + finalTrial + '</div></div>' +
            '<footer>⬤ DR: ПРОТОКОЛ 0xE7 ⬤ 8 вкладок ⬤ Уровень доступа: НЕОГРАНИЧЕН</footer>' +
            '<button id="glitchBtn">🔍 НАЖАТЬ, ЕСЛИ ХОЧЕШЬ УМЕРЕТЬ</button>' +
            '</div></div><script>' +
            'var tabs=document.querySelectorAll(".tab-btn");var contents=document.querySelectorAll(".tab-content");' +
            'tabs.forEach(function(t){t.addEventListener("click",function(){var target=t.getAttribute("data-tab");tabs.forEach(function(btn){btn.classList.remove("active");});contents.forEach(function(c){c.classList.remove("active");});t.classList.add("active");document.getElementById(target).classList.add("active");});});' +
            'var bracelet=document.getElementById("braceletIndicator");var bstate=0;' +
            'document.getElementById("glitchBtn").addEventListener("click",function(){bstate=(bstate+1)%3;bracelet.classList.remove("green","red","yellow");if(bstate===0)bracelet.classList.add("green");else if(bstate===1)bracelet.classList.add("yellow");else bracelet.classList.add("red");alert("Пупупу... ' + name + ' уже всё прочитал.");});' +
            'document.querySelectorAll(".copy-prompt-btn").forEach(function(btn){btn.addEventListener("click",function(){var promptDiv=this.previousElementSibling;var text=promptDiv.innerText;navigator.clipboard.writeText(text);alert("✅ Промпт скопирован!");});});' +
            '<\/script></body></html>';
        return html;
    }

    function loadMenu() {
        var grid = document.getElementById('charactersGrid');
        grid.innerHTML = '';
        var standard = [
            { name: 'ИВАН ДИОГЕНОВ', talent: 'Бета-тестер', tag: '#root', avatar: '⚡', file: 'ivan_profile_sound.html' },
            { name: 'КАЗУИЧИ СОДА', talent: 'Механик', tag: '#repair', avatar: '🔧', file: 'ivan_profile_sound.html' },
            { name: 'ТИАКИ НАМИКАМИ', talent: 'Геймер', tag: '#1CC', avatar: '🎮', file: 'ivan_profile_sound.html' },
            { name: '✨ НОВЫЙ ПЕРСОНАЖ', talent: 'Создать через вопросы', tag: '#генератор', avatar: '✨', url: 'generate_from_prompt.html', isLink: true }
        ];
        for (var i = 0; i < standard.length; i++) {
            var c = standard[i];
            var card = document.createElement('div');
            card.className = 'character-card';
            if (c.isLink) card.style.background = '#2a1a2aee';
            card.innerHTML = '<div class="character-avatar">' + c.avatar + '</div><div class="character-name">' + c.name + '</div><div class="character-title">' + c.talent + '</div><div class="character-tag">' + c.tag + '</div>';
            if (c.isLink) card.addEventListener('click', (function(url) { return function() { playSound(); setTimeout(function(){ window.location.href = url; }, 100); }; })(c.url));
            else card.addEventListener('click', (function(file) { return function() { playSound(); setTimeout(function(){ window.location.href = file; }, 100); }; })(c.file));
            grid.appendChild(card);
        }
        var custom = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        for (var j = 0; j < custom.length; j++) {
            var ch = custom[j];
            var cCard = document.createElement('div');
            cCard.className = 'character-card';
            cCard.style.background = '#1a2a2aee';
            cCard.style.borderColor = '#aa88aa';
            var shortPhrase = (ch.phrase || '').substring(0, 35);
            cCard.innerHTML = '<div class="character-avatar">' + (ch.avatar || '⭐') + '</div><div class="character-name">' + (ch.name || '').toUpperCase() + '</div><div class="character-title">' + (ch.talent || '') + '</div><div class="character-tag">' + shortPhrase + '...</div>';
            cCard.addEventListener('click', (function(charData) {
                return function() {
                    playSound();
                    var full = {
                        name: charData.name,
                        talent: charData.talent,
                        phrase: charData.phrase,
                        avatar: charData.avatar,
                        appearance: charData.appearance,
                        personality: charData.personality,
                        secret: charData.secret,
                        execName: charData.execName,
                        execDesc: charData.execDesc,
                        lastWords: charData.lastWords,
                        evidence: charData.evidence,
                        role: charData.role,
                        backstory: charData.backstory,
                        relationships: charData.relationships,
                        skills: charData.skills,
                        weaknesses: charData.weaknesses,
                        dialogues: charData.dialogues || [],
                        freeTimeEvents: charData.freeTimeEvents || [],
                        evidencesList: charData.evidencesList || [],
                        soundtrack: charData.soundtrack || [],
                        secretFile: charData.secretFile || '',
                        finalTrial: charData.finalTrial || '',
                        visualPrompt: charData.visualPrompt || ''
                    };
                    var html = buildProfileHTML(full);
                    var blob = new Blob([html], { type: 'text/html' });
                    var url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
                };
            })(ch));
            grid.appendChild(cCard);
        }
    }

    document.getElementById('refreshBtn').onclick = function() { loadMenu(); playSound(); };
    document.getElementById('clearAllBtn').onclick = function() {
        if (confirm('Удалить всех кастомных персонажей?')) {
            localStorage.removeItem('customCharacters');
            loadMenu();
            alert('✅ Все удалены');
        }
    };
    document.getElementById('exportAllBtn').onclick = function() {
        var chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        var blob = new Blob([JSON.stringify(chars, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.download = 'backup_' + Date.now() + '.json';
        a.href = URL.createObjectURL(blob);
        a.click();
        URL.revokeObjectURL(a.href);
    };
    var importFile = document.getElementById('importFileInput');
    document.getElementById('importBtn').onclick = function() { importFile.click(); };
    importFile.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            try {
                var imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    var current = JSON.parse(localStorage.getItem('customCharacters') || '[]');
                    var added = 0;
                    for (var i = 0; i < imported.length; i++) {
                        var exists = false;
                        for (var j = 0; j < current.length; j++) {
                            if (current[j].name === imported[i].name) { exists = true; break; }
                        }
                        if (!exists) {
                            current.push(imported[i]);
                            added++;
                        }
                    }
                    localStorage.setItem('customCharacters', JSON.stringify(current));
                    loadMenu();
                    alert('✅ Импортировано ' + added + ' персонажей');
                } else alert('Не массив');
            } catch(err) { alert('Ошибка файла'); }
            importFile.value = '';
        };
        reader.readAsText(file);
    };
    document.body.addEventListener('click', function() { initAudio(); }, { once: true });
    loadMenu();
</script>
    <!-- Фоновая музыка с кнопкой управления -->
<audio id="bgMusic" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
    Ваш браузер не поддерживает аудио.
</audio>
<div style="position: fixed; bottom: 20px; left: 20px; z-index: 999;">
    <button id="musicToggle" style="background: #2a1a1a; border: 2px solid #aa6644; color: #ffccaa; padding: 8px 16px; border-radius: 40px; cursor: pointer; font-family: monospace; font-weight: bold;">🔊 Музыка вкл</button>
</div>
<script>
    const music = document.getElementById('bgMusic');
    const toggleBtn = document.getElementById('musicToggle');
    let musicPlaying = false;
    music.volume = 0.3;
    music.play().then(() => {
        musicPlaying = true;
        toggleBtn.textContent = '🔇 Музыка выкл';
    }).catch(() => {});
    toggleBtn.addEventListener('click', () => {
        if (musicPlaying) {
            music.pause();
            toggleBtn.textContent = '🔊 Музыка вкл';
        } else {
            music.play();
            toggleBtn.textContent = '🔇 Музыка выкл';
        }
        musicPlaying = !musicPlaying;
    });
</script>
