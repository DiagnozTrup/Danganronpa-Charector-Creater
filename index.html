<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Danganronpa 2: Выбор персонажа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', 'Courier', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "⚠ ⚠ ⚠";
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #aa444466;
            white-space: nowrap;
            animation: scroll 20s linear infinite;
            pointer-events: none;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .crt {
            position: relative;
            max-width: 1400px;
            width: 100%;
            background: #0b0e0a;
            border: 12px solid #3a2a2a;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 0 4px #1f1a0e, inset 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(1px);
        }
        .crt::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            border-radius: 20px;
        }
        .game-title {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #d44a2e;
            padding-bottom: 15px;
        }
        .game-title h1 {
            font-size: clamp(28px, 7vw, 42px);
            letter-spacing: 4px;
            color: #ffe6cc;
            text-shadow: 0 0 8px #ff6644, 4px 4px 0 #3a1a1a;
            font-weight: bold;
        }
        .game-title p {
            font-size: clamp(14px, 4vw, 18px);
            color: #ffaa88;
            margin-top: 8px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #3a1a1a;
        }
        .section-label {
            font-size: clamp(18px, 5vw, 24px);
            color: #ffcc88;
            text-align: center;
            margin-bottom: 25px;
            background: #2a1a1acc;
            display: inline-block;
            padding: 8px 28px;
            border-radius: 40px;
            margin-left: auto;
            margin-right: auto;
            font-weight: bold;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px #ff664422;
        }
        .characters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
            margin: 30px 0;
        }
        .character-card {
            background: #1a1f1aee;
            backdrop-filter: blur(4px);
            border: 2px solid #aa6644;
            border-radius: 28px;
            width: min(240px, 85vw);
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .character-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,100,80,0.2), transparent);
            transition: left 0.5s;
        }
        .character-card:hover::after {
            left: 100%;
        }
        .character-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #ffaa66;
            box-shadow: 0 0 25px #ffaa6688;
        }
        .character-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #1e2a1a;
            border: 3px solid #ffaa66;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            transition: transform 0.2s;
        }
        .character-card:hover .character-avatar {
            transform: scale(1.05);
        }
        .character-name {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: bold;
            color: #ffeebb;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #2a1a1a;
        }
        .character-title {
            font-size: 13px;
            color: #ddbb88;
            margin-top: 5px;
            font-weight: bold;
        }
        .character-tag {
            font-size: 11px;
            background: #000000aa;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 30px;
            color: #ffcc88;
            margin-top: 10px;
        }
        .admin-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .admin-btn {
            background: #2a1a1a;
            border: 1px solid #aa6644;
            color: #ffccaa;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .admin-btn:hover {
            background: #4a2a2a;
            color: #fff;
            box-shadow: 0 0 8px #ff8866;
        }
        .monokuma-note {
            font-size: 14px;
            color: #ccaa88;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #5a3a2a;
            padding-top: 20px;
            font-weight: bold;
        }
        @media (max-width: 760px) {
            .character-card { width: 180px; padding: 15px 10px; }
            .character-avatar { width: 70px; height: 70px; font-size: 40px; }
            .character-name { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="crt">
    <div class="game-title"><h1>⚡ АКАДЕМИЯ НАДЕЖДЫ ⚡</h1><p>ОСТРОВ ДЖАББЕРВОК • РЕЖИМ ВЫБОРА ЦЕЛИ</p></div>
    <div class="section-label">🎮 ВЫБОР ПЕРСОНАЖА / ULTIMATE FILES 🎮</div>
    <div class="characters-grid" id="charactersGrid"></div>
    <div class="admin-buttons">
        <button id="refreshBtn" class="admin-btn">🔄 ОБНОВИТЬ МЕНЮ</button>
        <button id="exportAllBtn" class="admin-btn">📤 ЭКСПОРТ ВСЕХ</button>
        <button id="importBtn" class="admin-btn">📥 ИМПОРТ</button>
        <button id="clearAllBtn" class="admin-btn">🗑️ ОЧИСТИТЬ</button>
    </div>
    <div class="monokuma-note">🐻 MONOKUMA: «Пупупу... выбери цель для испытания. Создай своего персонажа через генератор!»</div>
</div>
<input type="file" id="importFileInput" style="display:none" accept=".json">

<script>
    // ЗВУК
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)(); }
    function playSound() {
        initAudio();
        if (!audioCtx) return;
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.start();
        osc.stop(now + 0.1);
    }

    // ГЕНЕРАЦИЯ ПРОФИЛЯ (простая конкатенация, без сложных строк)
    function buildProfileHTML(char) {
        var name = (char.name || '').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var talent = (char.talent || '').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var phrase = (char.phrase || '').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var avatar = char.avatar || '⭐';
        var appearance = (char.appearance || 'Не указана').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var personality = (char.personality || 'Загадочный').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var secret = (char.secret || 'Хранит тайну').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var execName = (char.execName || 'Судьбоносная казнь').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var execDesc = (char.execDesc || 'Описание казни').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var lastWords = (char.lastWords || '«...»').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var evidence = (char.evidence || 'Неизвестная улика').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var backstory = (char.backstory || 'История не известна').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var relationships = (char.relationships || 'Отношения не определены').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var skills = (char.skills || 'Неизвестно').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var weaknesses = (char.weaknesses || 'Неизвестно').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });
        var facts = (char.facts || 'Нет информации').replace(/[&<>]/g, function(m) { return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'); });

        return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Danganronpa :: ' + name + '</title><style>' +
            '*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a0000;font-family:"Courier New",monospace;padding:20px;}' +
            '.crt{max-width:1000px;margin:auto;background:#0a0a0a;border:8px solid #3a1a1a;border-radius:8px;}' +
            '.case-file{padding:20px;color:#e0e0e0;}.monokuma-header{text-align:center;border-bottom:3px solid #d42e2e;margin-bottom:20px;}' +
            '.monokuma-header h1{font-size:32px;color:#fff;text-shadow:3px 3px 0 #5a0000;}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}' +
            '.tab-btn{background:#2a0a0a;border:none;color:#cc9999;padding:12px 16px;cursor:pointer;}.tab-btn.active{background:#4a1a1a;color:#ff7777;}' +
            '.tab-content{display:none;max-height:55vh;overflow-y:auto;}.tab-content.active{display:block;}' +
            '.id-card{background:#111;border:2px solid #333;padding:18px;display:flex;gap:15px;}.id-avatar{width:80px;height:80px;border:2px solid #d42e2e;display:flex;align-items:center;justify-content:center;font-size:36px;}' +
            '.quote{border-left:4px solid #ff4444;background:#181010;padding:14px;margin:15px 0;}.execution{background:#1a0000;border:2px solid #aa2222;padding:16px;margin:15px 0;}' +
            'button{background:#2a0a0a;border:1px solid #aa4444;color:#ffaaaa;padding:14px;width:100%;margin-top:15px;cursor:pointer;}' +
            '.dossier-section{background:#0a0f0a;border-left:4px solid #ffaa66;padding:12px;margin:12px 0;}' +
            '.bracelet{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:8px;vertical-align:middle;}' +
            '.bracelet.green{background:#0f0;animation:pulse 1s infinite;}@keyframes pulse{0%{opacity:0.6}100%{opacity:1}}' +
            '</style></head><body><div class="crt"><div class="case-file">' +
            '<div class="monokuma-header"><h1>⚡ ФАЙЛ MONOKUMA ⚡</h1><p>🔒 ' + name + ' • ЗАКРЫТЫЙ ДОСТУП 🔒</p></div>' +
            '<div class="warning" style="background:#1a0505;border-left:8px solid red;padding:12px;margin-bottom:20px;">⚠️ СТРОГО КОНФИДЕНЦИАЛЬНО ⚠️</div>' +
            '<div class="tabs"><button class="tab-btn active" data-tab="tab1">📁 Личное дело</button><button class="tab-btn" data-tab="tab2">🎭 Диалоги</button><button class="tab-btn" data-tab="tab3">💀 Казнь</button><button class="tab-btn" data-tab="tab4">🔍 Улики</button><button class="tab-btn" data-tab="tab5">📜 Досье</button></div>' +
            '<div id="tab1" class="tab-content active"><div class="id-card"><div class="id-avatar">' + avatar + '</div><div><p><strong>Имя:</strong> ' + name + ' <span class="bracelet green" id="braceletIndicator"></span></p><p><strong>Талант:</strong> ' + talent + '</p><p><strong>Фраза:</strong> ' + phrase + '</p></div></div><div class="quote">' + phrase + '</div><div class="dossier-section"><strong>Внешность:</strong> ' + appearance + '</div><div class="dossier-section"><strong>Характер:</strong> ' + personality + '</div></div>' +
            '<div id="tab2" class="tab-content"><div class="quote">MONOKUMA: Пупупу! Ты кто?<br>' + name + ': ' + phrase + '</div><div class="quote">' + name + ': «Я уже прочитал все твои концовки.»</div><div class="quote">' + name + ': «Страшно, что однажды за экраном никого не окажется.»</div></div>' +
            '<div id="tab3" class="tab-content"><div class="execution"><strong>💀 КАЗНЬ: ' + execName + '</strong><br>' + execDesc + '</div><div class="quote">' + lastWords + '</div></div>' +
            '<div id="tab4" class="tab-content"><div class="dossier-section"><strong>🔍 Улика:</strong> ' + evidence + '</div></div>' +
            '<div id="tab5" class="tab-content"><div class="dossier-section"><strong>📜 История:</strong> ' + backstory + '</div><div class="dossier-section"><strong>💬 Отношения:</strong> ' + relationships + '</div><div class="dossier-section"><strong>⚔️ Навыки:</strong> ' + skills + '<br><strong>Слабости:</strong> ' + weaknesses + '</div><div class="dossier-section"><strong>🔮 Тайна:</strong> ' + secret + '</div><div class="dossier-section"><strong>✨ Факты:</strong> ' + facts + '</div></div>' +
            '<footer style="text-align:center; margin-top:20px;">⬤ DR: ПОЛНОЕ ДОСЬЕ ⬤</footer>' +
            '<button id="glitchBtn">🔍 НАЖАТЬ, ЕСЛИ ХОЧЕШЬ УМЕРЕТЬ</button>' +
            '</div></div><script>' +
            'var tabs=document.querySelectorAll(".tab-btn");var contents=document.querySelectorAll(".tab-content");' +
            'tabs.forEach(function(t){t.addEventListener("click",function(){var target=t.getAttribute("data-tab");' +
            'tabs.forEach(function(btn){btn.classList.remove("active");});' +
            'contents.forEach(function(c){c.classList.remove("active");});' +
            't.classList.add("active");document.getElementById(target).classList.add("active");});});' +
            'var bracelet=document.getElementById("braceletIndicator");var bstate=0;' +
            'document.getElementById("glitchBtn").addEventListener("click",function(){bstate=(bstate+1)%3;' +
            'bracelet.classList.remove("green","red","yellow");if(bstate===0)bracelet.classList.add("green");' +
            'else if(bstate===1)bracelet.classList.add("yellow");else bracelet.classList.add("red");' +
            'alert("Пупупу... Сгенерированный персонаж уже всё прочитал.");});' +
            '<\/script></body></html>';
    }

    // ЗАГРУЗКА МЕНЮ
    function loadMenu() {
        var grid = document.getElementById('charactersGrid');
        grid.innerHTML = '';
        var standard = [
            { name: 'ИВАН ДИОГЕНОВ', talent: 'Бета-тестер', tag: '#root', avatar: '⚡', file: 'ivan_profile_sound.html' },
            { name: 'КАЗУИЧИ СОДА', talent: 'Механик', tag: '#repair', avatar: '🔧', file: 'ivan_profile_sound.html' },
            { name: 'ТИАКИ НАМИКАМИ', talent: 'Геймер', tag: '#1CC', avatar: '🎮', file: 'ivan_profile_sound.html' },
            { name: '✨ НОВЫЙ ПЕРСОНАЖ', talent: 'Создать через вопросы', tag: '#генератор', avatar: '✨', url: 'generate_from_prompt.html', isLink: true }
        ];
        for (var i = 0; i < standard.length; i++) {
            var c = standard[i];
            var card = document.createElement('div');
            card.className = 'character-card';
            if (c.isLink) card.style.background = '#2a1a2aee';
            card.innerHTML = '<div class="character-avatar">' + c.avatar + '</div><div class="character-name">' + c.name + '</div><div class="character-title">' + c.talent + '</div><div class="character-tag">' + c.tag + '</div>';
            if (c.isLink) {
                card.addEventListener('click', function(url) { return function() { playSound(); setTimeout(function(){ window.location.href = url; }, 100); }; }(c.url));
            } else {
                card.addEventListener('click', function(file) { return function() { playSound(); setTimeout(function(){ window.location.href = file; }, 100); }; }(c.file));
            }
            grid.appendChild(card);
        }
        var custom = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        for (var j = 0; j < custom.length; j++) {
            var ch = custom[j];
            var cCard = document.createElement('div');
            cCard.className = 'character-card';
            cCard.style.background = '#1a2a2aee';
            cCard.style.borderColor = '#aa88aa';
            var shortPhrase = (ch.phrase || '').substring(0, 35);
            cCard.innerHTML = '<div class="character-avatar">' + (ch.avatar || '⭐') + '</div><div class="character-name">' + (ch.name || '').toUpperCase() + '</div><div class="character-title">' + (ch.talent || '') + '</div><div class="character-tag">' + shortPhrase + '...</div>';
            cCard.addEventListener('click', (function(charData) {
                return function() {
                    playSound();
                    var full = {
                        name: charData.name,
                        talent: charData.talent,
                        phrase: charData.phrase,
                        avatar: charData.avatar,
                        appearance: charData.appearance,
                        personality: charData.personality,
                        secret: charData.secret,
                        execName: charData.execName,
                        execDesc: charData.execDesc,
                        lastWords: charData.lastWords,
                        evidence: charData.evidence,
                        backstory: charData.backstory,
                        relationships: charData.relationships,
                        skills: charData.skills,
                        weaknesses: charData.weaknesses,
                        facts: charData.facts
                    };
                    var html = buildProfileHTML(full);
                    var blob = new Blob([html], { type: 'text/html' });
                    var url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
                };
            })(ch));
            grid.appendChild(cCard);
        }
    }

    // ОБРАБОТЧИКИ
    document.getElementById('refreshBtn').onclick = function() { loadMenu(); playSound(); };
    document.getElementById('clearAllBtn').onclick = function() {
        if (confirm('Удалить всех кастомных персонажей?')) {
            localStorage.removeItem('customCharacters');
            loadMenu();
            alert('✅ Все удалены');
        }
    };
    document.getElementById('exportAllBtn').onclick = function() {
        var chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        var data = JSON.stringify(chars, null, 2);
        var blob = new Blob([data], { type: 'application/json' });
        var a = document.createElement('a');
        a.download = 'backup_' + Date.now() + '.json';
        a.href = URL.createObjectURL(blob);
        a.click();
        URL.revokeObjectURL(a.href);
    };
    var importFile = document.getElementById('importFileInput');
    document.getElementById('importBtn').onclick = function() { importFile.click(); };
    importFile.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            try {
                var imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    var current = JSON.parse(localStorage.getItem('customCharacters') || '[]');
                    var added = 0;
                    for (var i = 0; i < imported.length; i++) {
                        var exists = false;
                        for (var j = 0; j < current.length; j++) {
                            if (current[j].name === imported[i].name) { exists = true; break; }
                        }
                        if (!exists) {
                            current.push(imported[i]);
                            added++;
                        }
                    }
                    localStorage.setItem('customCharacters', JSON.stringify(current));
                    loadMenu();
                    alert('✅ Импортировано ' + added + ' персонажей');
                } else alert('Не массив');
            } catch(err) { alert('Ошибка файла'); }
            importFile.value = '';
        };
        reader.readAsText(file);
    };
    document.body.addEventListener('click', function() { initAudio(); }, { once: true });
    loadMenu();
</script>
</body>
</html>
