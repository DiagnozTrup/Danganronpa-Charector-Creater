<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Danganronpa 2: Выбор персонажа</title>
    <style>
        /* Ваши существующие стили (я их сократил для читаемости, но вы можете оставить свои) */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101); font-family: 'Courier New', monospace; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .crt { position: relative; max-width: 1400px; width: 100%; background: #0b0e0a; border: 12px solid #3a2a2a; border-radius: 24px; padding: 30px 20px; box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5); }
        .crt::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 4px); pointer-events: none; border-radius: 20px; }
        .game-title { text-align: center; margin-bottom: 30px; border-bottom: 3px solid #d44a2e; padding-bottom: 15px; }
        .game-title h1 { font-size: clamp(28px, 7vw, 42px); letter-spacing: 4px; color: #ffe6cc; text-shadow: 0 0 8px #ff6644, 4px 4px 0 #3a1a1a; }
        .game-title p { font-size: clamp(14px, 4vw, 18px); color: #ffaa88; margin-top: 8px; }
        .section-label { font-size: clamp(18px, 5vw, 24px); color: #ffcc88; text-align: center; margin-bottom: 25px; background: #2a1a1acc; display: inline-block; padding: 8px 28px; border-radius: 40px; }
        .characters-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 35px; margin: 30px 0; }
        .character-card { background: #1a1f1aee; border: 2px solid #aa6644; border-radius: 28px; width: min(240px, 85vw); padding: 20px 15px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .character-card:hover { transform: translateY(-12px) scale(1.02); border-color: #ffaa66; box-shadow: 0 0 25px #ffaa6688; }
        .character-avatar { width: 90px; height: 90px; margin: 0 auto 15px; border-radius: 50%; background: #1e2a1a; border: 3px solid #ffaa66; display: flex; align-items: center; justify-content: center; font-size: 52px; }
        .character-name { font-size: clamp(18px, 5vw, 22px); font-weight: bold; color: #ffeebb; }
        .character-title { font-size: 13px; color: #ddbb88; margin-top: 5px; }
        .character-tag { font-size: 11px; background: #000000aa; display: inline-block; padding: 5px 12px; border-radius: 30px; color: #ffcc88; margin-top: 10px; }
        .admin-buttons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .admin-btn { background: #2a1a1a; border: 1px solid #aa6644; color: #ffccaa; padding: 10px 20px; border-radius: 40px; font-size: 13px; cursor: pointer; }
        .admin-btn:hover { background: #4a2a2a; box-shadow: 0 0 8px #ff8866; }
        .monokuma-note { font-size: 14px; color: #ccaa88; text-align: center; margin-top: 30px; border-top: 1px solid #5a3a2a; padding-top: 20px; }
        @media (max-width: 760px) { .character-card { width: 180px; } .character-avatar { width: 70px; height: 70px; font-size: 40px; } }
    </style>
</head>
<body>
<div class="crt">
    <div class="game-title"><h1>⚡ АКАДЕМИЯ НАДЕЖДЫ ⚡</h1><p>ОСТРОВ ДЖАББЕРВОК • РЕЖИМ ВЫБОРА ЦЕЛИ</p></div>
    <div class="section-label">🎮 ВЫБОР ПЕРСОНАЖА / ULTIMATE FILES 🎮</div>
    <div class="characters-grid" id="charactersGrid"></div>
    <div class="admin-buttons">
        <button id="refreshBtn" class="admin-btn">🔄 ОБНОВИТЬ МЕНЮ</button>
        <button id="exportAllBtn" class="admin-btn">📤 ЭКСПОРТ ВСЕХ</button>
        <button id="importBtn" class="admin-btn">📥 ИМПОРТ</button>
        <button id="clearAllBtn" class="admin-btn">🗑️ ОЧИСТИТЬ</button>
    </div>
    <div class="monokuma-note">🐻 MONOKUMA: «Пупупу... выбери цель для испытания. Создай персонажа через генератор!»</div>
</div>
<input type="file" id="importFileInput" style="display:none" accept=".json">

<script>
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)(); }
    function playSelectSound() {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.start();
        osc.stop(now + 0.1);
    }

    // Простая генерация профиля (без сложных строк)
    function generateProfileHTML(char) {
        return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>${char.name}</title>
<style>body{background:#1a0000;font-family:'Courier New';padding:20px;}.crt{max-width:1000px;margin:auto;background:#0a0a0a;border:8px solid #3a1a1a;padding:20px;}.tabs{display:flex;gap:5px;flex-wrap:wrap;}.tab-btn{background:#2a0a0a;border:none;color:#aa7777;padding:10px;cursor:pointer;}.tab-btn.active{background:#4a1a1a;color:#ff5555;}.tab-content{display:none;}.tab-content.active{display:block;}.id-card{background:#111;border:2px solid #333;padding:15px;display:flex;gap:15px;}.id-avatar{width:70px;height:70px;border:2px solid #d42e2e;display:flex;align-items:center;justify-content:center;font-size:30px;}.quote{border-left:4px solid #ff4444;background:#181010;padding:10px;margin:10px 0;}.execution{background:#1a0000;border:2px solid #aa2222;padding:10px;}</style>
<body><div class="crt"><div class="tabs"><button class="tab-btn active" data-tab="tab1">📁 Личное дело</button><button class="tab-btn" data-tab="tab2">🎭 Диалоги</button><button class="tab-btn" data-tab="tab3">💀 Казнь</button></div>
<div id="tab1" class="tab-content active"><div class="id-card"><div class="id-avatar">${char.avatar||'⭐'}</div><div><p><strong>Имя:</strong> ${char.name}</p><p><strong>Талант:</strong> ${char.talent}</p><p><strong>Фраза:</strong> ${char.phrase}</p></div></div><div class="quote">${char.phrase}</div><div class="execution">⚡ СЕКРЕТ: ${char.secret||'Неизвестно'}</div></div>
<div id="tab2" class="tab-content"><div class="quote">MONOKUMA: Пупупу! Ты кто?<br>${char.name}: ${char.phrase}</div></div>
<div id="tab3" class="tab-content"><div class="execution"><strong>${char.execName||'Казнь'}</strong><br>${char.execDesc||'Описание казни'}</div><div class="quote">${char.lastWords||'«...»'}</div></div>
<script>
const btns=document.querySelectorAll('.tab-btn');
const contents=document.querySelectorAll('.tab-content');
btns.forEach(btn=>{btn.addEventListener('click',()=>{let target=btn.getAttribute('data-tab');btns.forEach(b=>b.classList.remove('active'));contents.forEach(c=>c.classList.remove('active'));btn.classList.add('active');document.getElementById(target).classList.add('active');});});
<\/script>
</body></html>`;
    }

    function loadMenu() {
        const grid = document.getElementById('charactersGrid');
        grid.innerHTML = '';
        const standard = [
            { name: 'ИВАН ДИОГЕНОВ', talent: 'Бета-тестер', tag: '#root', avatar: '⚡', file: 'ivan_profile_sound.html' },
            { name: 'КАЗУИЧИ СОДА', talent: 'Механик', tag: '#repair', avatar: '🔧', file: 'ivan_profile_sound.html' },
            { name: 'ТИАКИ НАМИКАМИ', talent: 'Геймер', tag: '#1CC', avatar: '🎮', file: 'ivan_profile_sound.html' },
            { name: '✨ НОВЫЙ ПЕРСОНАЖ', talent: 'Создать через вопросы', tag: '#генератор', avatar: '✨', url: 'generate_from_prompt.html', isLink: true }
        ];
        standard.forEach(char => {
            const card = document.createElement('div');
            card.className = 'character-card';
            if (char.isLink) card.style.background = '#2a1a2aee';
            card.innerHTML = `<div class="character-avatar">${char.avatar}</div><div class="character-name">${char.name}</div><div class="character-title">${char.talent}</div><div class="character-tag">${char.tag}</div>`;
            if (char.isLink) card.addEventListener('click', () => { playSelectSound(); setTimeout(() => window.location.href = char.url, 100); });
            else card.addEventListener('click', () => { playSelectSound(); setTimeout(() => window.location.href = char.file, 100); });
            grid.appendChild(card);
        });
        const custom = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        custom.forEach(char => {
            const card = document.createElement('div');
            card.className = 'character-card';
            card.style.background = '#1a2a2aee';
            card.style.borderColor = '#aa88aa';
            card.innerHTML = `<div class="character-avatar">${char.avatar || '⭐'}</div><div class="character-name">${char.name.toUpperCase()}</div><div class="character-title">${char.talent}</div><div class="character-tag">${char.phrase.substring(0, 35)}...</div>`;
            card.addEventListener('click', () => {
                playSelectSound();
                const html = generateProfileHTML(char);
                const blob = new Blob([html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            });
            grid.appendChild(card);
        });
    }

    document.getElementById('refreshBtn').onclick = () => { loadMenu(); playSelectSound(); };
    document.getElementById('clearAllBtn').onclick = () => {
        if (confirm('Удалить всех кастомных персонажей?')) {
            localStorage.removeItem('customCharacters');
            loadMenu();
            alert('✅ Все удалены');
        }
    };
    document.getElementById('exportAllBtn').onclick = () => {
        const chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        const blob = new Blob([JSON.stringify(chars, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.download = `backup_${Date.now()}.json`;
        a.href = URL.createObjectURL(blob);
        a.click();
        URL.revokeObjectURL(a.href);
    };
    const importFile = document.getElementById('importFileInput');
    document.getElementById('importBtn').onclick = () => importFile.click();
    importFile.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    let current = JSON.parse(localStorage.getItem('customCharacters') || '[]');
                    let added = 0;
                    imported.forEach(c => {
                        if (!current.some(ex => ex.name === c.name)) {
                            current.push(c);
                            added++;
                        }
                    });
                    localStorage.setItem('customCharacters', JSON.stringify(current));
                    loadMenu();
                    alert(`✅ Импортировано ${added} персонажей`);
                } else alert('Не массив');
            } catch(err) { alert('Ошибка файла'); }
            importFile.value = '';
        };
        reader.readAsText(file);
    };
    document.body.addEventListener('click', () => initAudio(), { once: true });
    loadMenu();
</script>
</body>
</html>
