<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Danganronpa 2: Выбор персонажа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at 20% 30%, #1a0f0a, #050101);
            font-family: 'Courier New', 'Courier', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* Анимированные шевроны на фоне */
        body::before {
            content: "⚠ ⚠ ⚠";
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #aa444466;
            white-space: nowrap;
            animation: scroll 20s linear infinite;
            pointer-events: none;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .crt {
            position: relative;
            max-width: 1400px;
            width: 100%;
            background: #0b0e0a;
            border: 12px solid #3a2a2a;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 0 4px #1f1a0e, inset 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(1px);
        }
        .crt::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            border-radius: 20px;
        }
        .game-title {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #d44a2e;
            padding-bottom: 15px;
        }
        .game-title h1 {
            font-size: clamp(28px, 7vw, 42px);
            letter-spacing: 4px;
            color: #ffe6cc;
            text-shadow: 0 0 8px #ff6644, 4px 4px 0 #3a1a1a;
            font-weight: bold;
        }
        .game-title p {
            font-size: clamp(14px, 4vw, 18px);
            color: #ffaa88;
            margin-top: 8px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #3a1a1a;
        }
        .section-label {
            font-size: clamp(18px, 5vw, 24px);
            color: #ffcc88;
            text-align: center;
            margin-bottom: 25px;
            background: #2a1a1acc;
            display: inline-block;
            padding: 8px 28px;
            border-radius: 40px;
            margin-left: auto;
            margin-right: auto;
            font-weight: bold;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px #ff664422;
        }
        .characters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
            margin: 30px 0;
        }
        .character-card {
            background: #1a1f1aee;
            backdrop-filter: blur(4px);
            border: 2px solid #aa6644;
            border-radius: 28px;
            width: min(240px, 85vw);
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }
        .character-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,100,80,0.2), transparent);
            transition: left 0.5s;
        }
        .character-card:hover::after {
            left: 100%;
        }
        .character-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #ffaa66;
            box-shadow: 0 0 25px #ffaa6688;
        }
        .character-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #1e2a1a;
            border: 3px solid #ffaa66;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            transition: transform 0.2s;
        }
        .character-card:hover .character-avatar {
            transform: scale(1.05);
        }
        .character-name {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: bold;
            color: #ffeebb;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #2a1a1a;
        }
        .character-title {
            font-size: 13px;
            color: #ddbb88;
            margin-top: 5px;
            font-weight: bold;
        }
        .character-tag {
            font-size: 11px;
            background: #000000aa;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 30px;
            color: #ffcc88;
            margin-top: 10px;
        }
        .admin-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .admin-btn {
            background: #2a1a1a;
            border: 1px solid #aa6644;
            color: #ffccaa;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .admin-btn:hover {
            background: #4a2a2a;
            color: #fff;
            box-shadow: 0 0 8px #ff8866;
        }
        .monokuma-note {
            font-size: 14px;
            color: #ccaa88;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #5a3a2a;
            padding-top: 20px;
            font-weight: bold;
        }
        @media (max-width: 760px) {
            .character-card { width: 180px; padding: 15px 10px; }
            .character-avatar { width: 70px; height: 70px; font-size: 40px; }
            .character-name { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="crt">
    <div class="game-title"><h1>⚡ АКАДЕМИЯ НАДЕЖДЫ ⚡</h1><p>ОСТРОВ ДЖАББЕРВОК • РЕЖИМ ВЫБОРА ЦЕЛИ</p></div>
    <div class="section-label">🎮 ВЫБОР ПЕРСОНАЖА / ULTIMATE FILES 🎮</div>
    <div class="characters-grid" id="charactersGrid"></div>
    <div class="admin-buttons">
        <button id="refreshBtn" class="admin-btn">🔄 ОБНОВИТЬ МЕНЮ</button>
        <button id="exportAllBtn" class="admin-btn">📤 ЭКСПОРТ ВСЕХ</button>
        <button id="importBtn" class="admin-btn">📥 ИМПОРТ</button>
        <button id="clearAllBtn" class="admin-btn" style="background:#2a1a1a;">🗑️ ОЧИСТИТЬ</button>
    </div>
    <div class="monokuma-note">🐻 MONOKUMA: «Пупупу... выбери цель для испытания. Создай своего персонажа через промпт!»</div>
</div>
<input type="file" id="importFileInput" style="display:none" accept=".json">

<script>
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)(); }
    function playSelectSound() {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.start();
        osc.stop(now + 0.1);
    }

    function loadMenu() {
        const grid = document.getElementById('charactersGrid');
        grid.innerHTML = '';
        const standard = [
            { name: 'ИВАН ДИОГЕНОВ', talent: 'Бета-тестер Реальности', tag: '#root.access #0xE7', avatar: '⚡', file: 'ivan_profile_sound.html' },
            { name: 'КАЗУИЧИ СОДА', talent: 'Сверхшкольный Механик', tag: '#repair.exe #спасай_Сонию', avatar: '🔧', file: 'ivan_profile_sound.html' },
            { name: 'ТИАКИ НАМИКАМИ', talent: 'Сверхшкольный Геймер', tag: '#1CC.clear #баги_не_считаются', avatar: '🎮', file: 'ivan_profile_sound.html' },
            { name: '📋 ГЕНЕРАТОР ПРОМПТА', talent: 'Создай промпт для нейросети', tag: '#промпт #нейросеть', avatar: '📋', url: 'prompt_creator.html', isLink: true },
            { name: '🧠 ГЕНЕРАЦИЯ ИЗ ПРОМПТА', talent: 'Создай персонажа через ИИ', tag: '#промпт #генерация', avatar: '🧠', url: 'generate_from_prompt.html', isLink: true }
        ];
        standard.forEach(char => {
            const card = document.createElement('div');
            card.className = 'character-card';
            if (char.isLink && char.name === '🧠 ГЕНЕРАЦИЯ ИЗ ПРОМПТА') card.style.background = '#1a2a3aee';
            else if (char.isLink) card.style.background = '#2a1a2aee';
            card.innerHTML = `<div class="character-avatar">${char.avatar}</div><div class="character-name">${char.name}</div><div class="character-title">${char.talent}</div><div class="character-tag">${char.tag}</div>`;
            if (char.isLink) card.addEventListener('click', () => { playSelectSound(); setTimeout(() => window.location.href = char.url, 100); });
            else card.addEventListener('click', () => { playSelectSound(); setTimeout(() => window.location.href = char.file, 100); });
            grid.appendChild(card);
        });
        const custom = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        custom.forEach(char => {
            const card = document.createElement('div');
            card.className = 'character-card';
            card.style.background = '#1a2a2aee';
            card.style.borderColor = '#aa88aa';
            card.innerHTML = `<div class="character-avatar">${char.avatar || '⭐'}</div><div class="character-name">${char.name.toUpperCase()}</div><div class="character-title">${char.talent}</div><div class="character-tag">${char.phrase.substring(0, 35)}...</div>`;
            card.addEventListener('click', () => {
                playSelectSound();
                const win = window.open();
                win.document.write(char.htmlContent);
                win.document.close();
            });
            grid.appendChild(card);
        });
    }
    
    document.getElementById('refreshBtn').addEventListener('click', () => { loadMenu(); playSelectSound(); });
    document.getElementById('clearAllBtn').addEventListener('click', () => {
        if (confirm('Удалить всех кастомных персонажей?')) {
            localStorage.removeItem('customCharacters');
            loadMenu();
            alert('✅ Все кастомные персонажи удалены!');
        }
    });
    document.getElementById('exportAllBtn').addEventListener('click', () => {
        const chars = JSON.parse(localStorage.getItem('customCharacters') || '[]');
        const data = JSON.stringify(chars, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const a = document.createElement('a');
        a.download = `danganronpa_backup_${Date.now()}.json`;
        a.href = URL.createObjectURL(blob);
        a.click();
        URL.revokeObjectURL(a.href);
    });
    const importFile = document.getElementById('importFileInput');
    document.getElementById('importBtn').addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    let current = JSON.parse(localStorage.getItem('customCharacters') || '[]');
                    let added = 0;
                    imported.forEach(c => {
                        if (!current.some(ex => ex.name === c.name)) {
                            current.push(c);
                            added++;
                        }
                    });
                    localStorage.setItem('customCharacters', JSON.stringify(current));
                    loadMenu();
                    alert(`✅ Импортировано ${added} новых персонажей!`);
                } else alert('Ошибка: не массив');
            } catch(err) { alert('Ошибка при чтении файла'); }
            importFile.value = '';
        };
        reader.readAsText(file);
    });
    document.body.addEventListener('click', () => initAudio(), { once: true });
    loadMenu();
</script>
</body>
</html>
